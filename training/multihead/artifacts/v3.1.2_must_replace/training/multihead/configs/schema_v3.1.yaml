# Stage2 Multi-head Label Schema v3.1
# Canonical for training/multihead/ (legacy E1-A frozen).
#
# Changes vs v3:
# - Contactability: denied moved from Rule into head values
# - IdentityProcess: kind=event (not long-lived memory state for P0)

version: stage2_multihead_v3.1.1
knowledge_ontology: proposed_v2_action_audit
n_train_positive_values: 22
n_heads: 19
architecture: multihead
evidence_rule: >
  Do not auto-chain Employment→Income→Hardship→Capability without explicit evidence.
changelog_v3_1_1: >
  Pre-train: LegalRisk softmax → LegalProceeding + ComplianceRisk binaries (can co-fire);
  IdentityProcess train=false (mask=0); Employment.active Memory-only clarified.

heads:
  Employment:
    kind: state
    type: binary
    values: [disrupted, none]
    none_means: employment not disrupted / not evidenced
    map:
      disrupted: Employment/employment_disrupted
    not_trained:
      active: Employment/employment_active
    note: >
      ONLY disrupted is supervised. employment_active is Memory/Profile only —
      do NOT annotate「在职」as a Softmax/binary training label.

  Income:
    kind: state
    type: binary
    values: [unavailable, none]
    map:
      unavailable: Income/income_unavailable
    training_merge_into_NegotiationRequest:
      - Income/income_timing_info
      - Income/income_improving

  FinancialHardship:
    kind: state
    type: binary
    values: ["yes", "no"]
    map:
      yes: Financial/financial_difficulty_negotiation
    note: >
      困难原因/处境（为什么难），不是「付多少」本身。
      与 RepaymentCapability 区分：FH=原因，RC=当前支付能力（partial/insufficient）。

  RepaymentCapability:
    kind: state
    type: softmax
    values: [partial, insufficient, none]
    exclusive: true
    map:
      partial: Capability/partial_repayment_capability
      insufficient: Capability/repayment_difficulty_and_fund_raising
    note: >
      当前支付能力。insufficient ≠ FinancialHardship（FH 是原因侧）。
      例：只能还500→partial；完全没钱→insufficient；只说住院未谈金额→RC 可 none。

  Health:
    kind: state
    type: binary
    values: ["yes", "no"]
    map:
      yes: Health/health_related_hardship

  FamilyBurden:
    kind: state
    type: binary
    values: ["yes", "no"]
    map:
      yes: Family/family_care_and_adversity

  Asset:
    kind: state
    type: softmax
    values: [available, unavailable, none]
    exclusive: true
    map:
      available: Asset/asset_available
      unavailable: Asset/asset_unavailable
    training_merge_into_available:
      - Asset/asset_liquidation_plan

  Contactability:
    kind: state
    type: softmax
    values: [reachable, unreachable, denied, none]
    exclusive: true
    map:
      reachable: Contact/contact_history_and_availability
      unreachable: Contact/contact_unreachable_or_status_change
      denied: Contact/contact_denied_or_withholding
    note: >
      denied = 主动拒绝合作的联系行为（非客观联不上）。
      unreachable = 失联/联不上；勿与 denied 混用。

  Commitment:
    kind: state
    type: softmax
    values: [committed, resistant, none]
    exclusive: true
    map:
      committed: Intention/positive_commitment
      resistant: Intention/client_resistance_pattern

  Responsibility:
    kind: state
    type: binary
    values: [denying, none]
    map:
      denying: Intention/denial_and_dispute

  DebtDispute:
    kind: state
    type: binary
    values: ["yes", "no"]
    map:
      yes: Financial/debt_dispute

  LegalProceeding:
    kind: state
    type: binary
    values: ["yes", "no"]
    map:
      yes: Legal/legal_situation_and_proceeding
    training_merge_into_yes:
      - Legal/debt_third_party_claim
    note: >
      Independent of ComplianceRisk — lawsuit and regulatory complaint can both be true.

  ComplianceRisk:
    kind: state
    type: binary
    values: ["yes", "no"]
    map:
      yes: Legal/legal_compliance_risk
    note: >
      Independent of LegalProceeding — can co-fire with proceeding.

  BankConstraint:
    kind: state
    type: binary
    values: ["yes", "no"]
    map:
      yes: Financial/external_or_bank_constraints

  ObjectiveBlocker:
    kind: state
    type: binary
    values: ["yes", "no"]
    map:
      yes: Capability/objective_external_restrictions

  CognitiveSupport:
    kind: state
    type: binary
    values: ["yes", "no"]
    map:
      yes: Capability/cognitive_and_communication_support

  NegotiationRequest:
    kind: process
    type: binary
    values: ["yes", "no"]
    map:
      yes: Negotiation/negotiation_request
    training_merge_into_yes:
      - Negotiation/deferment_or_extension
      - Income/income_timing_info
      - Income/income_improving
    note: >
      yes = 显式协商请求（分期/延期/减免/「能不能…」）。
      「我考虑一下」≠ yes。仅陈述困难 → FH/RC，不标本 head。

  IdentityProcess:
    kind: event
    type: binary
    values: ["yes", "no"]
    train: false
    map:
      yes: Identity/identity_verification_and_dispute_handling
    note: >
      train=false: always head_mask=0, not in Softmax loss, not in train_labels export.
      Kept as schema head for eval/memory/diff. Alone must not set need_update=1.
      Contrast: NegotiationRequest / Grievance ARE trained process heads.

  Grievance:
    kind: process
    type: binary
    values: ["yes", "no"]
    map:
      yes: Negotiation/customer_grievance

rule_signals:
  FearStance: Financial/high_risk_or_fear_negotiation
  Deceased: Contact/contact_deceased
  OrganizedFraud: Legal/organized_fraud
  FamilyPrivacy: Family/family_privacy_secrecy
  TransactionFraud: Financial/transaction_dispute_and_fraud
  SelfHarmRisk: Risk/self_harm_or_suicide

memory_fields:
  FamilyNetwork: Family/family_social_and_responsibility
  ExternalDebt: Financial/external_debt_profile
  ContactProfile: Contact/contact_profile
  RepaymentProfile: Financial/repayment_profile
  PaymentHistory: Financial/payment_history
  EvidenceInteraction: Evidence/evidence_interaction
  DocumentUnavailability: Evidence/document_unavailability
  NegotiationStatus: Negotiation/negotiation_status
  AccountSettled: Financial/account_settled
  CustomerMotivation: Intention/customer_state_and_motivation
  ThirdPartyEvent: Contact/third_party_related_event
  GovBenefit: Income/gov_benefit_related

p0_policy:
  # P0/P1 are NOT trained. need_update / active_heads are derived at inference via
  # diff(previous_memory, merge(previous_memory, pred)).
  trained: false
  derived_from: state_diff
  p0_exclude_heads:
    - IdentityProcess

train_policy:
  context_mode: recent_turns_char_budget
  window_turns: 4
  char_budget: 200
  inference_context_mode: recent_turns_char_budget  # same as train
  label_source: memory_after_mapped_to_heads
  feed_memory_before_to_model: false
  trim_priority:  # when over budget, drop earliest low-priority first
    - collector_filler
    - collector_normal
    - customer_normal
    - state_evidence_turn
    - current_turn  # never drop if possible
  default_head_mask:
    IdentityProcess: 0
  note: >
    Train/infer: last N=4 turns, max 200 Chinese chars (trim oldest; keep last 200 if still over).
    Do NOT use full dialogue prefix. Persistence via merge at inference only.
  report_head_kinds:
    state: true
    event_process: true  # IdentityProcess / NegotiationRequest / Grievance — report separately

merge_policy:
  non_default_overwrites: true
  none_keeps_previous: true
  do_not_persist_heads:
    - IdentityProcess
  note: Pred none/default does not erase previous memory.
# Structure freeze after v3.1.1: no further head/value changes until v4.
# Allowed: include_raw / definition / examples / collector_action / rule_signals / overrides.
