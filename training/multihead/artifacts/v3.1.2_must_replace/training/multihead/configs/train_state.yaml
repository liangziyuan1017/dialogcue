# Multihead current-state training (v3.1) — colleague-final defaults
# P0/P1 NOT trained. IdentityProcess train mask=0.

schema_path: schema_v3.1.yaml
# Explicit device for Ascend full-data env. Quote required for YAML safety.
# Comment out to auto: NPU > CUDA > CPU.
device: "npu:0"
model_name: ../../../hfl/chinese-roberta-wwm-ext-large
max_length: 256
batch_size: 16
epochs: 8
warmup_ratio: 0.10
grad_clip: 1.0
early_stop_patience: 2
seed: 42

# Optional: warm-start encoder from E1-A Stage1 checkpoint (outside multihead).
# If missing, train from HF/scratch (script prints WARN).
init_from_encoder: true
encoder_ckpt: ../../checkpoints/stage1/stage1_last.pt

data:
  train: ../data/state/state_train.jsonl
  val: ../data/state/state_val.jsonl
  test: ../data/state/state_test.jsonl
  use_mock_if_missing: false

output_dir: ../checkpoints/state_v31

optimizer:
  encoder_lr: 1.0e-5
  head_lr: 5.0e-5
  weight_decay: 0.01

loss:
  effective_number_beta: 0.999
  use_class_weight: true
  # Optional focal for rare positives (Grievance/ComplianceRisk/…). Baseline: false.
  use_focal: false
  focal_gamma: 2.0

# Rare-head sampling (post-baseline). When true, prefer batches with supervised rows
# on sparse heads — not enabled for first full-data run.
sampling:
  ensure_min_supervised: false

monitor:
  metric: macro_f1  # primary

# Context contract (must match build_state_dataset)
context:
  window_turns: 4
  char_budget: 200
