    partial_repayment_capability:
      definition: 客户当前仅有部分还款能力或资金，或因账户限额、银行政策等原因无法一次性全额还款，但有固定每月可支配金额可用于分期还款。
      collector_action: 确认客户具体可承担金额（包括一次性部分或每月固定金额）及可用时间，引导客户优先偿还部分欠款，建议分批还款或更换支付方式，并协商分期或延期等后续还款方案。
