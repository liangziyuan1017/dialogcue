    asset_liquidation_plan:
      definition: 客户正在推进或计划通过变现资产筹集还款资金的路径，包括出售/拟出售房产、车辆、保险、证券、设备、经营资产等；关注处置阶段、回款时间与障碍。与
        asset_available（仅有资产）不同：本 Fact 表示已进入变现执行/计划。
      collector_action: 跟进资产变现进度与证明（合同、过户、到账），评估回款能否覆盖欠款；若受阻则改评估替代还款来源或协商方案。
