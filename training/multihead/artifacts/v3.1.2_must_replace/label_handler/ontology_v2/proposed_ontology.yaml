    organized_fraud:
      definition: 客户被认定涉及大规模、有组织或系统性的欺诈活动（如团伙诈骗、批量恶意逃废债等），具有组织性、预谋性和规模化特征。
      collector_action: 立即升级至风控或法务部门，暂停常规催收，启动法律诉讼或刑事报案流程，避免进一步资金损失。
      include_raw:
      - mass_fraud
      exclude_notes: 与legal_authority_involvement_claim（已合并入legal_situation_and_proceeding）的边界：后者为客户声称诈骗，需核实后暂缓；本fact为已认定有组织欺诈，直接升级。与其他fact均不同。
      role: Fact
      fact_type: State
      dimension: FraudRisk
      state_value: organized
      train_label: FraudRisk.organized
      raw_count_sum: 1
  Negotiation:
    customer_grievance:
      definition: 客户在催收对话中表现出负面情绪或态度，包括对催收过程、产品服务的抱怨或投诉，声称存在争议，感受到催收压力，或缺乏理解催收员的同理心。这些状态均需催收员采取安抚、倾听、共情、解释并引导的软性处理方式。
      collector_action: 安抚客户情绪，耐心倾听并记录具体问题或投诉内容，避免争论或辩解；使用共情语句建立情感连接，识别并缓解客户的压力信号；根据问题类型解释合规流程或提议折中还款方案；必要时承诺反馈并引导客户通过官方渠道正式投诉；最终引导客户回归还款协商核心话题。
