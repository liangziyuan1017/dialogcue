    objective_external_restrictions:
      definition: 客户因地理位置、交通不便、意外事故、自然灾害、恶劣天气、银行系统延迟、APP不可用、年龄限制等客观不可控因素，导致无法按时还款或配合催收。
      collector_action: 主动了解具体限制类型及细节，要求客户提供客观证据（如事故证明、官方预警、交通管制通知、银行凭证、年龄证明等）；根据影响程度和证据可信度，给予临时宽限期、费用减免、替代还款方案（远程还款、调整还款日、延期等）；记录预计恢复时间；对无法提供有效证据的，视为主观理由继续施压；同时指导客户通过其他渠道（电话、网页端）完成还款。
