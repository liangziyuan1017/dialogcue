      train_label: RepaymentCapability.partial
      raw_count_sum: 505
    repayment_difficulty_and_fund_raising:
      definition: 客户因资金不足、时间紧张、或缺乏外部筹资渠道等原因，表明当前无法或不愿意按时还款，需要催收员引导其制定还款计划或提供替代方案。
      collector_action: 首先确认逾期事实并表达理解，深入询问具体困难原因（资金不足、忙碌、无法筹资等）；评估客户是否有筹资能力或意愿；若有，督促其动用渠道尽快还款；若无，提供分期、延期、减免等替代方案；要求客户制定具体还款计划并明确时间节点和金额；施加适当压力并评估未来还款潜力。
