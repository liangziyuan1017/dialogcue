    legal_compliance_risk:
      definition: 客户在对话中提出或暗示催收方存在威胁、骚扰等不当行为，或已寻求法律咨询、律师介入、威胁诉讼/举报，或已正式向监管机构、平台或内部渠道提交投诉；或客户声称其他债权人存在不当行为；或客户援引法律权益限制催收沟通方式。此类情况表明催收合规风险显著升高，需立即转为合规处理模式。
      collector_action: 立即停止当前施压话术或常规催收，安抚客户情绪（如适用），避免对抗性回应或提供法律建议；详细记录客户陈述、投诉细节或权利主张，将案件标记并上报合规部门或主管，转为低压力协商策略或按照投诉处理流程跟进；若涉及其他债权人不当行为，则确认具体细节并展示本机构合规性以引导客户区分对待，同时避免其作为拖延还款借口。
      include_raw:
      - collector_threat
      - harassment_claim
      - alleged_harassment
