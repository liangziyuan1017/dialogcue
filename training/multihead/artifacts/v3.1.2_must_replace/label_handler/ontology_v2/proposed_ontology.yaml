    financial_difficulty_negotiation:
      definition: 客户因各种财务困难（如收入中断、突发支出、债务过重、借款困难、高负债负担、现金提取或预借现金、租金未付、住房支出压力、第三方欠款或储蓄计划导致的优先级问题、高信用额度等）导致暂时或长期无法按时还款。催收员需主动了解具体原因，评估整体财务状况，提供灵活还款方案。
