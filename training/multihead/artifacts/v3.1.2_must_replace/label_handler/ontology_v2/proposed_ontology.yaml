    cognitive_and_communication_support:
      definition: 客户存在认知、沟通、语言、教育背景、识字困难或性格特质方面的障碍，导致催收交互效率低下，需要催收员调整沟通策略并提供针对性指导。
      collector_action: 识别具体困难类型（如语言障碍、记忆不清、流程不理解、识字困难、学历差异、防御或对抗性格等），提供针对性指导：放慢语速、使用简单词汇、分段确认信息；通过提示引导回忆；详细解释流程并分步引导；指导客户通过替代途径完成操作；对需关怀型温和耐心，对防御型共情建立信任；避免发送文字材料。
