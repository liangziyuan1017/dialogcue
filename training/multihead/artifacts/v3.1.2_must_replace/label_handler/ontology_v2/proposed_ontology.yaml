      exclude_notes: 与legal_situation_and_proceeding的边界：后者处理法律状态，不涉及投诉/威胁；与legal_policy_reference_as_defense的边界：后者处理政策引用，不涉及合规风险。
      role: Fact
      fact_type: Constraint
      dimension: Compliance
      train_label: ComplianceRisk.yes
      raw_count_sum: 100
    legal_situation_and_proceeding:
      definition: 客户当前在法律层面的各种状态、态度或涉及法律流程的情形，包括：已陷入法律程序（起诉、判决、强制执行、破产等）、被羁押、有开庭日期；客户声称与诈骗或警察介入相关；客户对债务金额/真实性提出争议或寻求调解；客户对法律操作（授权、诉讼成本等）表示担忧或拒绝；客户涉及强制划扣或合同非自愿；客户已委托律师或正在寻求法律建议；客户需签署相关文件等。涵盖主观态度与客观法律状态。
      collector_action: 主动询问客户法律状态的具体情况。根据客户反馈采取相应措施：要求提供正式法律文书（立案通知书、判决书、羁押证明、公安机关回执、争议证据、强制划扣文书等）；若客户处于法律程序、声称诈骗/警察介入、提出争议调解、或已委托律师，则暂停常规催收并转交法务团队（或引导进入争议处理流程）；若客户被羁押，则调整还款方案至释放后；若有法院开庭日期，则避免当天催收；若客户对法律后果或操作担忧，则清晰解释并提供协商还款方案或替代方式；若客户涉及强制划扣，则核实背景、解释后果并警示主动还款；若客户需签署文件，则说明文件类型、确认意愿并跟进签署进度。避免过度施压，优先评估对还款意愿和能力的影响。
