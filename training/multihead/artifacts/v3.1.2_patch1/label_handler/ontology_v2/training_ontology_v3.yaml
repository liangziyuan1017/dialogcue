evidence_rule: Do not auto-chain Employment→Income→Hardship→Capability without explicit evidence.
frequency_glossary:
  _intro: 以下数字都是「规模代理」，不是金标准 utterance 训练样本量。同一条 raw 可能进入多个口径，跨口径不要直接相加当独立样本。有训练合并（absorbed_from）时，源 fact 的计数会先加进目标再算 proxy。
  yaml_raw_count_sum: proposed_ontology.yaml 里该 knowledge fact 的 raw_count_sum：discovery/压缩阶段累计的 raw 标签出现量（偏历史库存）。
  unemp_include_n_raws: 失业场景标签.txt 中，命中该 fact 的 include_raw 列表的「不同 raw 名字」个数。
  unemp_include_occ: 失业场景中，上述命中 raw 的 count 之和。include_raw 写得越宽，这个数越大（上限偏乐观）。
  anti_include_n_raws: 反催收场景标签.txt 中，命中 include_raw 的不同 raw 名字个数（规则命中，非 LLM）。
  anti_include_occ: 反催收场景中，include_raw 规则命中的 occurrence 之和。
  anti_llm_n_labels: 反催收 LLM Coverage 评判中，action∈{cover,soft} 且 ontology_ids 含本 fact 的 「不同 raw 标签条数」（标签级，不计 count 权重）。
  anti_llm_weighted_occ: 同上，但按 raw 的 count 加权求和（occurrence 级）。比 anti_llm_n_labels 更能反映实际出现量。
  biz_preset_count: 业务人员预置标签 composability 审计里，该 fact 被组成映射用到的次数 （失业向预置场景偏置；为 0 不代表永远不出现）。
  sample_proxy: 单 label 规模代理 = max(anti_llm_weighted_occ, unemp_include_occ, yaml_raw_count_sum)。取三者最大，用于相对排序；不是真实可训练条数。
  sample_proxy_sum: 某 head 下所有 train_value 的 sample_proxy 之和（不含 none）。会重复计数，只适合粗看「这个维度有多热」。
  anti_llm_weighted_occ_sum: 某 head 下各 train_value 的 anti_llm_weighted_occ 之和。
  unemp_include_occ_sum: 某 head 下各 train_value 的 unemp_include_occ 之和。
  frequency.self: 未合并前，本 knowledge fact 自身的各项频次。
  frequency.absorbed_from: 训练层合并进来的源 fact 列表及各自频次；已加进外层 frequency 合计（再参与 sample_proxy）。
  how_to_read: 日常看相对规模：优先看 sample_proxy / anti_llm_weighted_occ。看失业场景覆盖：看 unemp_include_occ。看业务预置是否用到：看 biz_preset_count。不要把
    sample_proxy_sum 当成互斥样本量。
