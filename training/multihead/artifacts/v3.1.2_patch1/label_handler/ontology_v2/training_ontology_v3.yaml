note: >-
  v3.1.2-patch1 (Asset/Contactability/Commitment path-A). Knowledge ontology stays at 47.
  Stage2 train layer: 19 heads / 22 positive train values (+ none). Commitment keeps
  committed/resistant (path A: supplement resistant≥50; no ontology expand).
