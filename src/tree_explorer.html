<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F004 Decision Tree Explorer</title>
<script src="dagre.min.js"></script>
<script src="cytoscape.min.js"></script>
<script src="cytoscape-dagre.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;
  --green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
#toolbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:16px;gap:12px;flex-shrink:0}
#logo{height:32px;display:flex;align-items:center;gap:8px}
#logo svg{height:32px;width:32px}
#logo span{font-size:18px;font-weight:600;color:var(--blue);letter-spacing:-0.02em;white-space:nowrap}
.stat{font-size:11px;color:var(--muted)}
#search{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-size:12px;width:240px;outline:none}
#search:focus{border-color:var(--blue)}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--muted);margin-left:auto}
.legend-item{display:flex;align-items:center;gap:5px}
.lbox{width:14px;height:14px;border-radius:3px;border-width:2px;border-style:solid}
.lbox.opening{border-color:var(--green);background:rgba(34,197,94,.15)}
.lbox.decision{border-color:var(--blue);background:rgba(59,130,246,.15)}
.lbox.ending{border-color:var(--amber);background:rgba(245,158,11,.15);border-radius:50%}
.lbox.abrupt{border-color:var(--red);background:rgba(239,68,68,.15);border-radius:0;clip-path:polygon(50% 0%,100% 100%,0% 100%)}
#main{display:flex;flex:1;overflow:hidden}
#cy{flex:1}
#detail{width:380px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:16px;flex-shrink:0}
#empty-detail{text-align:center;padding:48px 16px;color:#64748b;font-size:13px}
.breadcrumb{font-size:11px;color:var(--muted);margin-bottom:10px}
.breadcrumb span{color:var(--blue);cursor:pointer}
.breadcrumb span:hover{text-decoration:underline}
#detail h2{font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px;letter-spacing:-0.01em}
.section{margin-bottom:16px}
.section-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:2px;font-size:11px}
.tag.fact{border-color:var(--green);color:#4ade80}
.tag.emotion{border-color:#a78bfa;color:#c4b5fd}
.tag.gesture-open{border-color:var(--green);color:#4ade80}
.tag.gesture-end{border-color:var(--amber);color:#fbbf24}
.tag.gesture-abrupt{border-color:var(--red);color:#f87171}
.wbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.wbar-item{font-size:10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px}
.wbar-item .wlabel{color:#60a5fa}
.wbar-item .wcount{color:var(--muted)}
.script{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:4px;font-size:11px}
.script .stxt{color:var(--text);margin-bottom:2px}
.script .smeta{color:var(--muted);font-size:10px}
.script .swill{display:inline-block;border:1px solid var(--blue);border-radius:9999px;padding:0 6px;color:#60a5fa;font-size:9px;margin-right:4px}
.script .sgesture{display:inline-block;border-radius:9999px;padding:0 6px;font-size:9px;margin-right:4px}
.script .sgesture.opening{border:1px solid var(--green);color:#4ade80}
.script .sgesture.ending{border:1px solid var(--amber);color:#fbbf24}
.script .saction{display:inline-block;border-radius:9999px;padding:0 6px;font-size:9px;margin-right:4px;border:1px solid #d29922;color:#d29922}
.child-link{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:2px;font-size:10px;color:#60a5fa;cursor:pointer}
.child-link:hover{border-color:var(--blue)}
</style>
</head>
<body>
<div id="toolbar">
  <div id="logo">
    <svg viewBox="0 0 32 32" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="#3b82f6" stroke-width="2"/><circle cx="23" cy="8" r="5" stroke="#f59e0b" stroke-width="2"/><polygon points="8,18 14,30 2,30" stroke="#ef4444" stroke-width="2" fill="none"/><line x1="14" y1="8" x2="18" y2="8" stroke="#cbd5e1" stroke-width="2"/></svg>
    <span>Decision Tree</span>
  </div>
  <span class="stat" id="stats"></span>
  <div class="legend">
    <div class="legend-item"><div class="lbox opening"></div>Opening</div>
    <div class="legend-item"><div class="lbox decision"></div>Decision</div>
    <div class="legend-item"><div class="lbox ending"></div>Normal End</div>
    <div class="legend-item"><div class="lbox abrupt"></div>Abrupt End</div>
  </div>
  <input type="text" id="search" placeholder="Search node...">
  <span class="stat" id="search-info"></span>
</div>
<div id="main">
  <div id="cy"></div>
  <div id="detail">
    <div id="empty-detail">Click a node to inspect</div>
    <div id="detail-content" style="display:none"></div>
  </div>
</div>
<script>
let cy, treeData, nodeMap={};

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function trunc(s,m){return s.length<=m?s:s.slice(0,m-1)+'…'}

function nodeType(node,depth){
  if(depth===0) return 'opening';
  if(node.state_id==='abrupt_end') return 'abrupt';
  if(node.state_id==='normal_end') return 'ending';
  return 'decision';
}

function indexTree(node,parentId=null,depth=0){
  const id = node.state_id+'_'+Math.random().toString(36).slice(2,6);
  node._id=id; node._parentId=parentId; node._depth=depth; node._type=nodeType(node,depth);
  nodeMap[id]=node;
  (node.children||[]).forEach(c=>indexTree(c,id,depth+1));
}

function treeToCytoscape(node,pid=null,depth=0){
  const id=node._id;
  const type=node._type;
  const pool=node.sentence_pool||[];
  const kids=node.children||[];

  let label=node.state_id;
  let sub='';
  if(type==='opening') sub=pool.filter(s=>s.gesture_type==='opening').length+' greetings';
  else if(type==='abrupt') sub='no proper close';
  else if(type==='ending') sub=pool.filter(s=>s.gesture_type==='ending').length+' closing scripts';
  else sub=pool.length+' scripts';

  const cyNodes=[{data:{id,label,sub,type,nodeRef:id,poolSize:pool.length}}];
  const cyEdges=[];

  if(pid!==null){
    const bk=node.branch_key||{};
    let bl='';
    if(bk.facts&&bk.facts.length) bl+=bk.facts.join(', ');
    if(bk.emotions&&bk.emotions.length) bl+=(bl?' | ':'')+bk.emotions.join(', ');
    if(bk.abrupt) bl='abrupt';
    if(bk.end_type==='normal') bl='normal end';
    if(bk.end_type==='abrupt') bl='abrupt end';
    if(!bl) bl='∅';
    cyEdges.push({data:{source:pid,target:id,label:bl}});
  }

  for(const child of kids){
    const sub2=treeToCytoscape(child,id,depth+1);
    cyNodes.push(...sub2.nodes);
    cyEdges.push(...sub2.edges);
  }

  return {nodes:cyNodes,edges:cyEdges};
}

function initCytoscape(elements){
  cy=cytoscape({
    container:document.getElementById('cy'),
    elements,
    style:[
      {selector:'node[type="opening"]',style:{
        'shape':'round-rectangle','width':280,'height':44,
        'background-color':'#052e16','border-color':'#22c55e','border-width':2,
        'label':'data(label)','text-halign':'center','text-valign':'center',
        'color':'#4ade80','font-size':14,'font-weight':600,'font-family':'-apple-system,sans-serif',
        'text-wrap':'wrap','text-max-width':260,
      }},
      {selector:'node[type="decision"]',style:{
        'shape':'round-rectangle','width':280,'height':44,
        'background-color':'#1e3a5f','border-color':'#3b82f6','border-width':2,
        'label':'data(label)','text-halign':'center','text-valign':'center',
        'color':'#60a5fa','font-size':13,'font-weight':600,'font-family':'-apple-system,sans-serif',
        'text-wrap':'wrap','text-max-width':260,
      }},
      {selector:'node[type="ending"]',style:{
        'shape':'ellipse','width':180,'height':60,
        'background-color':'#422006','border-color':'#f59e0b','border-width':2,
        'label':'data(label)','text-halign':'center','text-valign':'center',
        'color':'#fbbf24','font-size':14,'font-weight':600,'font-family':'-apple-system,sans-serif',
      }},
      {selector:'node[type="abrupt"]',style:{
        'shape':'triangle','width':160,'height':80,
        'background-color':'#450a0a','border-color':'#ef4444','border-width':2,
        'label':'data(label)','text-halign':'center','text-valign':'center',
        'color':'#f87171','font-size':12,'font-weight':600,'font-family':'-apple-system,sans-serif',
      }},
      {selector:'edge',style:{
        'width':2,'line-color':'#cbd5e1','target-arrow-color':'#cbd5e1','target-arrow-shape':'triangle',
        'curve-style':'bezier','arrow-scale':0.8,
        'label':'data(label)','font-size':10,'font-weight':500,'color':'#94a3b8',
        'text-rotation':'autorotate','text-margin-y':-6,
        'text-wrap':'wrap','text-max-width':120,
      }},
      {selector:'node:active',style:{'border-width':3,'border-color':'#ffffff'}},
      {selector:'node.highlighted',style:{'border-width':3,'border-color':'#ffffff'}},
    ],
    layout:{
      name:'dagre',
      rankDir:'TB',
      spacingFactor:1.2,
      nodeSep:30,
      rankSep:80,
      alignVertical:false,
      alignHorizontal:false,
    },
    userZoomingEnabled:true,
    userPanningEnabled:true,
    boxSelectionEnabled:false,
  });

  cy.on('tap','node',function(e){
    const node=e.target;
    const refId=node.data('nodeRef');
    if(refId){
      selectedNode=nodeMap[refId];
      renderDetail();
      cy.nodes().removeClass('highlighted');
      node.addClass('highlighted');
    }
  });

  cy.on('tap',function(e){
    if(e.target===cy){
      selectedNode=null;
      cy.nodes().removeClass('highlighted');
      document.getElementById('empty-detail').style.display='';
      document.getElementById('detail-content').style.display='none';
    }
  });
}

let selectedNode=null;

function renderDetail(){
  if(!selectedNode){
    document.getElementById('empty-detail').style.display='';
    document.getElementById('detail-content').style.display='none';
    return;
  }
  document.getElementById('empty-detail').style.display='none';
  const dc=document.getElementById('detail-content');
  dc.style.display='';
  const n=selectedNode, type=n._type;

  let h='';
  const path=[];
  let cur=n;
  while(cur){path.unshift(cur);cur=cur._parentId?nodeMap[cur._parentId]:null;}
  h+=`<div class="breadcrumb">${path.map((p,i)=>`<span onclick="navTo('${p._id}')">${esc(p.state_id)}</span>${i<path.length-1?' / ':''}`).join('')}</div>`;

  const tl={opening:'Opening (Start)',decision:'Decision Point',ending:'Normal End',abrupt:'Abrupt End'};
  h+=`<h2>${esc(n.state_id)}</h2>`;
  h+=`<div class="section"><div class="section-title">Node Type</div><span class="tag gesture-${type==='opening'?'open':type}">${tl[type]||type}</span></div>`;

  const bk=n.branch_key||{};
  h+=`<div class="section"><div class="section-title">Branch Key</div>`;
  (bk.facts||[]).forEach(f=>h+=`<span class="tag fact">${esc(f)}</span> `);
  (bk.emotions||[]).forEach(e=>h+=`<span class="tag emotion">${esc(e)}</span> `);
  if(bk.abrupt||bk.end_type==='abrupt') h+=`<span class="tag gesture-abrupt">abrupt</span> `;
  if(bk.end_type==='normal') h+=`<span class="tag gesture-end">normal end</span> `;
  if(!(bk.facts||[]).length&&!(bk.emotions||[]).length&&!bk.abrupt&&!bk.end_type) h+=`<span style="color:#64748b">∅</span>`;
  h+=`</div>`;

  const pool=n.sentence_pool||[];
  if(pool.length>0){
    const wCounts={};
    pool.forEach(s=>{const w=s.customer_willingness||'none';wCounts[w]=(wCounts[w]||0)+1;});
    h+=`<div class="section"><div class="section-title">Willingness Distribution</div><div class="wbar">`;
    Object.entries(wCounts).sort((a,b)=>b[1]-a[1]).forEach(([w,c])=>{
      h+=`<span class="wbar-item"><span class="wlabel">${esc(w)}</span> <span class="wcount">${c}</span></span>`;
    });
    h+=`</div></div>`;
    const aCounts={};
    pool.forEach(s=>{if(s.collector_action){aCounts[s.collector_action]=(aCounts[s.collector_action]||0)+1;}});
    if(Object.keys(aCounts).length>0){
      h+=`<div class="section"><div class="section-title">Collector Actions</div><div class="wbar">`;
      Object.entries(aCounts).sort((a,b)=>b[1]-a[1]).forEach(([a,c])=>{
        h+=`<span class="wbar-item"><span class="wlabel" style="color:#d29922">${esc(a)}</span> <span class="wcount">${c}</span></span>`;
      });
      h+=`</div></div>`;
    }
  }

  h+=`<div class="section"><div class="section-title">Sentence Pool (${pool.length})</div>`;
  const byWill={};
  pool.forEach(s=>{const w=s.customer_willingness||'none';(byWill[w]=byWill[w]||[]).push(s);});
  for(const[w,scripts]of Object.entries(byWill).sort()){
    h+=`<div style="margin-bottom:8px"><div style="font-size:11px;color:#60a5fa;margin-bottom:3px">when customer is <b>${esc(w)}</b>:</div>`;
    scripts.forEach(s=>{
      let gt='';
      if(s.gesture_type==='opening') gt=`<span class="sgesture opening">OPENING</span>`;
      else if(s.gesture_type==='ending') gt=`<span class="sgesture ending">ENDING</span>`;
      let actTag=s.collector_action?`<span class="saction">${esc(s.collector_action)}</span>`:'';
      h+=`<div class="script">${gt}${actTag}<span class="swill">${esc(w)}</span><span class="stxt">${esc(s.script_text)}</span><div class="smeta">${esc(s.script_id)} | ${(s.source_call_ids||[]).join(', ')}</div></div>`;
    });
    h+=`</div>`;
  }
  if(!pool.length) h+=`<span style="color:#64748b">empty</span>`;
  h+=`</div>`;

  const kids=n.children||[];
  h+=`<div class="section"><div class="section-title">Children (${kids.length})</div>`;
  kids.forEach(c=>h+=`<span class="child-link" onclick="navTo('${c._id}')">${esc(c.state_id)}</span> `);
  if(!kids.length) h+=`<span style="color:#64748b">leaf node</span>`;
  h+=`</div>`;
  dc.innerHTML=h;
}

function navTo(id){
  selectedNode=nodeMap[id];
  renderDetail();
  const cyNode=cy.getElementById(id);
  if(cyNode&&cyNode.length>0){
    cy.nodes().removeClass('highlighted');
    cyNode.addClass('highlighted');
    cy.animate({center:{eles:cyNode}},{duration:300});
  }
}

function setupSearch(){
  const input=document.getElementById('search');
  const info=document.getElementById('search-info');
  input.addEventListener('input',()=>{
    const q=input.value.toLowerCase().trim();
    if(!q){info.textContent='';return;}
    const matches=Object.values(nodeMap).filter(n=>
      n.state_id.toLowerCase().includes(q)||
      (n.sentence_pool||[]).some(s=>s.script_text.toLowerCase().includes(q))
    );
    info.textContent=`${matches.length} match${matches.length!==1?'es':''}`;
    if(matches.length>0) navTo(matches[0]._id);
  });
}

function countNodes(n){return 1+(n.children||[]).reduce((s,c)=>s+countNodes(c),0);}

fetch('decision_tree.json')
  .then(r=>r.json())
  .then(data=>{
    treeData=data;
    indexTree(data);
    const{nodes,edges}=treeToCytoscape(data);
    const total=countNodes(data);
    document.getElementById('stats').textContent=`${total} nodes · 1 opening · 1 normal end · 1 abrupt end`;
    initCytoscape({nodes,edges});
    selectedNode=treeData;
    renderDetail();
    setupSearch();
  });
</script>
</body>
</html>
