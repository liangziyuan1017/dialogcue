<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F004 Decision Tree Explorer</title>
<script src="dagre.min.js"></script>
<script src="cytoscape.min.js"></script>
<script src="cytoscape-dagre.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;
  --green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
#toolbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:16px;gap:12px;flex-shrink:0}
#logo{height:32px;display:flex;align-items:center;gap:8px}
#logo svg{height:32px;width:32px}
#logo span{font-size:18px;font-weight:600;color:var(--blue);letter-spacing:-0.02em;white-space:nowrap}
.stat{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--muted);margin-left:auto}
.legend-item{display:flex;align-items:center;gap:5px}
.lbox{width:14px;height:14px;border-radius:3px;border-width:2px;border-style:solid}
.lbox.opening{border-color:var(--green);background:rgba(34,197,94,.15)}
.lbox.decision{border-color:var(--blue);background:rgba(59,130,246,.15)}
.lbox.ending{border-color:var(--amber);background:rgba(245,158,11,.15);border-radius:50%}
.lbox.abrupt{border-color:var(--red);background:rgba(239,68,68,.15);border-radius:0;clip-path:polygon(50% 0%,100% 100%,0% 100%)}

#main{display:flex;flex:1;overflow:hidden}
#cy{flex:1}
#detail{width:420px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:16px;flex-shrink:0;display:flex;flex-direction:column}

#tracer{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
#tracer-title{font-size:12px;font-weight:600;color:var(--blue);margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px}
#dialog-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12px;outline:none;margin-bottom:8px}
#dialog-select:focus{border-color:var(--blue)}
#trace-controls{display:flex;gap:8px;margin-bottom:10px}
#trace-controls button{flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
#trace-controls button:hover{border-color:var(--blue);color:var(--blue)}
#btn-start{border-color:var(--green)!important;color:var(--green)!important}
#btn-start:hover{background:rgba(34,197,94,.15)!important}
#btn-end{border-color:var(--amber)!important;color:var(--amber)!important}
#btn-end:hover{background:rgba(245,158,11,.15)!important}
#btn-end.abrupt{border-color:var(--red)!important;color:var(--red)!important}

#flow{flex:1;overflow-y:auto}
#flow-title{font-size:10px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.flow-step{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(51,65,85,.5);cursor:pointer;transition:background .1s}
.flow-step:hover{background:rgba(59,130,246,.08);border-radius:4px}
.flow-step.active{background:rgba(59,130,246,.15);border-radius:4px}
.flow-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.flow-num.collector{background:#1e3a5f;color:#60a5fa;border:1px solid #3b82f6}
.flow-num.customer{background:#1a2a1a;color:#4ade80;border:1px solid #22c55e}
.flow-content{flex:1;min-width:0}
.flow-role{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.flow-role.collector{color:#60a5fa}
.flow-role.customer{color:#4ade80}
.flow-text{font-size:11px;color:var(--text);line-height:1.4;word-break:break-all}
.flow-meta{font-size:9px;color:var(--muted);margin-top:2px;display:flex;gap:4px;flex-wrap:wrap}
.flow-tag{display:inline-block;border-radius:9999px;padding:0 5px;font-size:9px;border:1px solid}
.flow-tag.action{border-color:#d29922;color:#d29922}
.flow-tag.willingness{border-color:#60a5fa;color:#60a5fa}
.flow-tag.fact{border-color:#22c55e;color:#4ade80}
.flow-tag.emotion{border-color:#a78bfa;color:#c4b5fd}
.flow-tag.gesture-open{border-color:#22c55e;color:#4ade80}
.flow-tag.gesture-end{border-color:#f59e0b;color:#fbbf24}
.flow-tag.gesture-abrupt{border-color:#ef4444;color:#f87171}

#node-info{padding-top:16px;border-top:1px solid var(--border)}
#node-info h3{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px}
.ni-section{margin-bottom:12px}
.ni-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:4px}
.ni-tag{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:2px;font-size:11px}
.ni-tag.fact{border-color:var(--green);color:#4ade80}
.ni-tag.emotion{border-color:#a78bfa;color:#c4b5fd}
.ni-script{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin-bottom:3px;font-size:11px}
.ni-script .stxt{color:var(--text);margin-bottom:2px}
.ni-script .smeta{color:var(--muted);font-size:9px}
</style>
</head>
<body>
<div id="toolbar">
  <div id="logo">
    <svg viewBox="0 0 32 32" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="#3b82f6" stroke-width="2"/><circle cx="23" cy="8" r="5" stroke="#f59e0b" stroke-width="2"/><polygon points="8,18 14,30 2,30" stroke="#ef4444" stroke-width="2" fill="none"/><line x1="14" y1="8" x2="18" y2="8" stroke="#cbd5e1" stroke-width="2"/></svg>
    <span>Decision Tree</span>
  </div>
  <span class="stat" id="stats"></span>
  <div class="legend">
    <div class="legend-item"><div class="lbox opening"></div>Opening</div>
    <div class="legend-item"><div class="lbox decision"></div>Decision</div>
    <div class="legend-item"><div class="lbox ending"></div>Normal End</div>
    <div class="legend-item"><div class="lbox abrupt"></div>Abrupt End</div>
  </div>
</div>
<div id="main">
  <div id="cy"></div>
  <div id="detail">
    <div id="tracer">
      <div id="tracer-title">Dialog Tracer</div>
      <select id="dialog-select"><option value="">-- Select a dialog --</option></select>
      <div id="trace-controls">
        <button id="btn-start" onclick="goStart()">Start</button>
        <button id="btn-end" onclick="goEnd()">End</button>
      </div>
      <div id="flow-title">Dialog Flow</div>
      <div id="flow"></div>
    </div>
    <div id="node-info"></div>
  </div>
</div>
<script>
let cy, treeData, nodeMap={}, dialogData=[], currentDialog=null, tracePath=[], traceIdx=-1;

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function nodeType(node,depth){
  if(depth===0) return 'opening';
  if(node.state_id==='abrupt_end') return 'abrupt';
  if(node.state_id==='normal_end') return 'ending';
  return 'decision';
}

function indexTree(node,parentId=null,depth=0){
  const id=node.state_id+'_'+Math.random().toString(36).slice(2,6);
  node._id=id;node._parentId=parentId;node._depth=depth;node._type=nodeType(node,depth);
  nodeMap[id]=node;
  (node.children||[]).forEach(c=>indexTree(c,id,depth+1));
}

function treeToCytoscape(node,pid=null,depth=0){
  const id=node._id, type=node._type, pool=node.sentence_pool||[], kids=node.children||[];
  let label=node.state_id;
  const cyNodes=[{data:{id,label,type,nodeRef:id,poolSize:pool.length}}];
  const cyEdges=[];
  if(pid!==null){
    const bk=node.branch_key||{};
    let bl='';
    if(bk.facts&&bk.facts.length) bl+=bk.facts.join(', ');
    if(bk.emotions&&bk.emotions.length) bl+=(bl?' | ':'')+bk.emotions.join(', ');
    if(bk.abrupt) bl='abrupt';
    if(bk.end_type==='normal') bl='normal end';
    if(bk.end_type==='abrupt') bl='abrupt end';
    if(!bl) bl='∅';
    cyEdges.push({data:{source:pid,target:id,label:bl}});
  }
  for(const child of kids){
    const sub=treeToCytoscape(child,id,depth+1);
    cyNodes.push(...sub.nodes);
    cyEdges.push(...sub.edges);
  }
  return {nodes:cyNodes,edges:cyEdges};
}

function initCytoscape(elements){
  cy=cytoscape({
    container:document.getElementById('cy'),
    elements,
    style:[
      {selector:'node[type="opening"]',style:{'shape':'round-rectangle','width':280,'height':44,'background-color':'#052e16','border-color':'#22c55e','border-width':2,'label':'data(label)','text-halign':'center','text-valign':'center','color':'#4ade80','font-size':14,'font-weight':600,'font-family':'-apple-system,sans-serif','text-wrap':'wrap','text-max-width':260}},
      {selector:'node[type="decision"]',style:{'shape':'round-rectangle','width':280,'height':44,'background-color':'#1e3a5f','border-color':'#3b82f6','border-width':2,'label':'data(label)','text-halign':'center','text-valign':'center','color':'#60a5fa','font-size':13,'font-weight':600,'font-family':'-apple-system,sans-serif','text-wrap':'wrap','text-max-width':260}},
      {selector:'node[type="ending"]',style:{'shape':'ellipse','width':180,'height':60,'background-color':'#422006','border-color':'#f59e0b','border-width':2,'label':'data(label)','text-halign':'center','text-valign':'center','color':'#fbbf24','font-size':14,'font-weight':600,'font-family':'-apple-system,sans-serif'}},
      {selector:'node[type="abrupt"]',style:{'shape':'triangle','width':160,'height':80,'background-color':'#450a0a','border-color':'#ef4444','border-width':2,'label':'data(label)','text-halign':'center','text-valign':'center','color':'#f87171','font-size':12,'font-weight':600,'font-family':'-apple-system,sans-serif'}},
      {selector:'edge',style:{'width':2,'line-color':'#334155','target-arrow-color':'#334155','target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':0.7,'label':'data(label)','font-size':9,'font-weight':500,'color':'#64748b','text-rotation':'autorotate','text-margin-y':-5,'text-wrap':'wrap','text-max-width':100}},
      {selector:'node.on-path',style:{'border-width':3,'border-color':'#ffffff','background-opacity':1}},
      {selector:'edge.on-path',style:{'width':3,'line-color':'#60a5fa','target-arrow-color':'#60a5fa','color':'#60a5fa'}},
      {selector:'node.off-path',style:{'opacity':0.25}},
      {selector:'edge.off-path',style:{'opacity':0.15}},
      {selector:'node.highlighted',style:{'border-width':3,'border-color':'#ffffff'}},
    ],
    layout:{name:'dagre',rankDir:'TB',spacingFactor:1.2,nodeSep:30,rankSep:80},
    userZoomingEnabled:true,userPanningEnabled:true,boxSelectionEnabled:false,
  });

  cy.on('tap','node',function(e){
    const node=e.target;
    const refId=node.data('nodeRef');
    if(refId) showNodeInfo(nodeMap[refId]);
  });
}

function traceDialogPath(callId){
  const path=[];
  function walk(node){
    const pool=node.sentence_pool||[];
    const has=pool.some(s=>(s.source_call_ids||[]).includes(callId));
    if(has||node.state_id==='initial_contact') path.push(node._id);
    for(const c of (node.children||[])) walk(c);
  }
  walk(treeData);

  // ensure end nodes are included
  const normalId=Object.values(nodeMap).find(n=>n.state_id==='normal_end')?._id;
  const abruptId=Object.values(nodeMap).find(n=>n.state_id==='abrupt_end')?._id;
  const lastNode=nodeMap[path[path.length-1]];
  if(lastNode&&lastNode.children){
    for(const c of lastNode.children){
      if(c.state_id==='normal_end'||c.state_id==='abrupt_end'){
        if(!path.includes(c._id)) path.push(c._id);
      }
    }
  }
  // if the dialog has closing actions, it ends at normal_end
  const dlg=dialogData.find(d=>d.call_id===callId);
  if(dlg){
    const hasClosing=dlg.turns.some(t=>t.action==='closure'||t.action==='goodbye');
    if(hasClosing&&normalId&&!path.includes(normalId)) path.push(normalId);
    if(!hasClosing&&abruptId&&!path.includes(abruptId)) path.push(abruptId);
  }

  return path;
}

function highlightPath(path){
  cy.elements().removeClass('on-path off-path highlighted');
  if(!path||path.length===0){
    cy.elements().style('opacity','');
    return;
  }
  const pathSet=new Set(path);
  cy.nodes().forEach(n=>{
    if(pathSet.has(n.id())) n.addClass('on-path');
    else n.addClass('off-path');
  });
  cy.edges().forEach(e=>{
    if(pathSet.has(e.data('source'))&&pathSet.has(e.data('target'))) e.addClass('on-path');
    else e.addClass('off-path');
  });
  const pathEles=cy.nodes().filter(n=>pathSet.has(n.id()));
  cy.animate({center:{eles:pathEles}},{duration:400});
}

function renderFlow(dialog){
  const flow=document.getElementById('flow');
  if(!dialog){flow.innerHTML='<div style="color:#64748b;font-size:11px;padding:8px">Select a dialog to trace</div>';return;}
  let h='';
  dialog.turns.forEach((t,i)=>{
    const isCollector=t.role==='催收员';
    const cls=isCollector?'collector':'customer';
    let meta='';
    if(t.action) meta+=`<span class="flow-tag action">${esc(t.action)}</span>`;
    if(t.willingness) meta+=`<span class="flow-tag willingness">${esc(t.willingness)}</span>`;
    if(t.gesture_type==='opening') meta+=`<span class="flow-tag gesture-open">OPENING</span>`;
    if(t.gesture_type==='ending') meta+=`<span class="flow-tag gesture-end">ENDING</span>`;
    (t.facts||[]).forEach(f=>meta+=`<span class="flow-tag fact">${esc(f)}</span>`);
    (t.emotions||[]).forEach(e=>meta+=`<span class="flow-tag emotion">${esc(e)}</span>`);
    h+=`<div class="flow-step" data-idx="${i}" onclick="goStep(${i})">`;
    h+=`<div class="flow-num ${cls}">${i+1}</div>`;
    h+=`<div class="flow-content">`;
    h+=`<div class="flow-role ${cls}">${isCollector?'Collector':'Customer'}</div>`;
    h+=`<div class="flow-text">${esc(t.text)}</div>`;
    if(meta) h+=`<div class="flow-meta">${meta}</div>`;
    h+=`</div></div>`;
  });
  flow.innerHTML=h;
}

function selectDialog(callId){
  currentDialog=dialogData.find(d=>d.call_id===callId)||null;
  if(!currentDialog){
    tracePath=[];traceIdx=-1;
    highlightPath(null);
    renderFlow(null);
    document.getElementById('node-info').innerHTML='';
    document.getElementById('btn-end').classList.remove('abrupt');
    return;
  }
  tracePath=traceDialogPath(callId);
  traceIdx=0;
  highlightPath(tracePath);
  renderFlow(currentDialog);

  // determine end type
  const hasClosing=currentDialog.turns.some(t=>t.action==='closure'||t.action==='goodbye');
  const endBtn=document.getElementById('btn-end');
  endBtn.classList.toggle('abrupt',!hasClosing);
  endBtn.textContent=hasClosing?'End':'Abrupt End';
}

function goStart(){
  if(!tracePath.length) return;
  traceIdx=0;
  const nodeId=tracePath[0];
  const cyNode=cy.getElementById(nodeId);
  if(cyNode&&cyNode.length){
    cy.nodes().removeClass('highlighted');
    cyNode.addClass('highlighted');
    cy.animate({center:{eles:cyNode}},{duration:300});
  }
  showNodeInfo(nodeMap[nodeId]);
  // highlight first step in flow
  document.querySelectorAll('.flow-step').forEach(el=>el.classList.remove('active'));
  const firstStep=document.querySelector('.flow-step[data-idx="0"]');
  if(firstStep) firstStep.classList.add('active');
}

function goEnd(){
  if(!tracePath.length) return;
  traceIdx=tracePath.length-1;
  const nodeId=tracePath[traceIdx];
  const cyNode=cy.getElementById(nodeId);
  if(cyNode&&cyNode.length){
    cy.nodes().removeClass('highlighted');
    cyNode.addClass('highlighted');
    cy.animate({center:{eles:cyNode}},{duration:300});
  }
  showNodeInfo(nodeMap[nodeId]);
  // highlight last step in flow
  const steps=document.querySelectorAll('.flow-step');
  steps.forEach(el=>el.classList.remove('active'));
  if(steps.length) steps[steps.length-1].classList.add('active');
}

function goStep(idx){
  if(!currentDialog) return;
  // find which tree node this step maps to
  const turn=currentDialog.turns[idx];
  if(!turn) return;
  // highlight the step
  document.querySelectorAll('.flow-step').forEach(el=>el.classList.remove('active'));
  const stepEl=document.querySelector(`.flow-step[data-idx="${idx}"]`);
  if(stepEl) stepEl.classList.add('active');

  // find matching tree node by checking which node has this turn's script_id
  const callId=currentDialog.call_id;
  const scriptId=callId+'_t'+turn.turn_index;
  let matchedNodeId=null;
  for(const nid of tracePath){
    const n=nodeMap[nid];
    if(!n) continue;
    const pool=n.sentence_pool||[];
    if(pool.some(s=>s.script_id===scriptId)){
      matchedNodeId=nid;
      break;
    }
  }
  if(matchedNodeId){
    const cyNode=cy.getElementById(matchedNodeId);
    if(cyNode&&cyNode.length){
      cy.nodes().removeClass('highlighted');
      cyNode.addClass('highlighted');
      cy.animate({center:{eles:cyNode}},{duration:300});
    }
    showNodeInfo(nodeMap[matchedNodeId]);
  }
}

function showNodeInfo(node){
  if(!node){document.getElementById('node-info').innerHTML='';return;}
  const ni=document.getElementById('node-info');
  const type=node._type;
  const tl={opening:'Opening (Start)',decision:'Decision Point',ending:'Normal End',abrupt:'Abrupt End'};
  let h=`<h3>${esc(node.state_id)}</h3>`;
  h+=`<div class="ni-section"><div class="ni-title">Type</div>${tl[type]||type}</div>`;
  const bk=node.branch_key||{};
  h+=`<div class="ni-section"><div class="ni-title">Branch Key</div>`;
  (bk.facts||[]).forEach(f=>h+=`<span class="ni-tag fact">${esc(f)}</span>`);
  (bk.emotions||[]).forEach(e=>h+=`<span class="ni-tag emotion">${esc(e)}</span>`);
  if(!bk.facts?.length&&!bk.emotions?.length&&!bk.abrupt&&!bk.end_type) h+=`<span style="color:#64748b">∅</span>`;
  h+=`</div>`;
  const pool=node.sentence_pool||[];
  h+=`<div class="ni-section"><div class="ni-title">Sentences (${pool.length})</div>`;
  pool.slice(0,10).forEach(s=>{
    let tags='';
    if(s.collector_action) tags+=`<span class="flow-tag action" style="margin-right:3px">${esc(s.collector_action)}</span>`;
    if(s.customer_willingness) tags+=`<span class="flow-tag willingness" style="margin-right:3px">${esc(s.customer_willingness)}</span>`;
    h+=`<div class="ni-script">${tags}<span class="stxt">${esc(s.script_text)}</span><div class="smeta">${esc(s.script_id)}</div></div>`;
  });
  if(pool.length>10) h+=`<div style="color:#64748b;font-size:10px">...and ${pool.length-10} more</div>`;
  h+=`</div>`;
  ni.innerHTML=h;
}

function countNodes(n){return 1+(n.children||[]).reduce((s,c)=>s+countNodes(c),0);}

Promise.all([
  fetch('decision_tree.json').then(r=>r.json()),
  fetch('dialog_records.json').then(r=>r.json()),
]).then(([tree,dialogs])=>{
  treeData=tree;
  dialogData=dialogs;
  indexTree(tree);
  const{nodes,edges}=treeToCytoscape(tree);
  const total=countNodes(tree);
  document.getElementById('stats').textContent=`${total} nodes · ${dialogs.length} dialogs · 1 opening · 1 normal end · 1 abrupt end`;
  initCytoscape({nodes,edges});

  const sel=document.getElementById('dialog-select');
  dialogs.forEach((d,i)=>{
    const opt=document.createElement('option');
    opt.value=d.call_id;
    const hasClosing=d.turns.some(t=>t.action==='closure'||t.action==='goodbye');
    opt.textContent=`${i+1}. ${d.call_id.slice(-6)} (${d.turns.length} turns${hasClosing?' → normal':' → abrupt'})`;
    sel.appendChild(opt);
  });
  sel.addEventListener('change',()=>selectDialog(sel.value));
  renderFlow(null);
});
</script>
</body>
</html>
