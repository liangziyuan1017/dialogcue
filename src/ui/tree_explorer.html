<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F004 Decision Tree Explorer</title>
<script src="dagre.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;
  --green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
#toolbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:16px;gap:12px;flex-shrink:0}
#logo{height:32px;display:flex;align-items:center;gap:8px}
#logo svg{height:32px;width:32px}
#logo span{font-size:18px;font-weight:600;color:var(--blue);letter-spacing:-0.02em;white-space:nowrap}
.stat{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--muted);margin-left:auto}
.legend-item{display:flex;align-items:center;gap:5px}
.lbox{width:14px;height:14px;border-radius:3px;border-width:2px;border-style:solid}
.lbox.opening{border-color:var(--green);background:rgba(34,197,94,.15)}
.lbox.decision{border-color:var(--blue);background:rgba(59,130,246,.15)}
.lbox.emotion{border-color:#a78bfa;background:rgba(167,139,250,.15);border-radius:50%}
.lbox.action{border-color:#2dd4bf;background:rgba(45,212,191,.15);transform:rotate(45deg);width:10px;height:10px}
.lbox.ending{border-color:var(--amber);background:rgba(245,158,11,.15);border-radius:50%}
.lbox.abrupt{border-color:var(--red);background:rgba(239,68,68,.15);border-radius:0;clip-path:polygon(50% 0%,100% 100%,0% 100%)}

#main{display:flex;flex:1;overflow:hidden}
#cy{flex:1}
#detail{width:420px;background:var(--surface);border-left:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}

#flow-panel{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;min-height:0}
#info-panel{flex-shrink:0;max-height:40%;overflow-y:auto;padding:16px;border-top:2px solid var(--blue);background:var(--bg);transition:max-height .25s ease,padding .25s ease,opacity .25s ease;max-height:0;padding-top:0;padding-bottom:0;opacity:0}
#info-panel.open{max-height:40%;padding:16px;opacity:1}

#tracer{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
#tracer-title{font-size:12px;font-weight:600;color:var(--blue);margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px}
#dialog-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12px;outline:none;margin-bottom:8px}
#dialog-select:focus{border-color:var(--blue)}
#trace-controls{display:flex;gap:8px;margin-bottom:10px}
#trace-controls button{flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
#trace-controls button:hover{border-color:var(--blue);color:var(--blue)}
#btn-start{border-color:var(--green)!important;color:var(--green)!important}
#btn-start:hover{background:rgba(34,197,94,.15)!important}
#btn-start.playing{background:rgba(34,197,94,.25)!important;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
#btn-end{border-color:var(--amber)!important;color:var(--amber)!important}
#btn-end:hover{background:rgba(245,158,11,.15)!important}
#btn-end.abrupt{border-color:var(--red)!important;color:var(--red)!important}
#btn-view{border-color:#2dd4bf!important;color:#2dd4bf!important}
#btn-view:hover{background:rgba(45,212,191,.15)!important}
#btn-view.active{background:rgba(45,212,191,.25)!important}

#flow{flex:1;overflow-y:auto}
#flow-title{font-size:10px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.flow-step{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(51,65,85,.5);cursor:pointer;transition:background .1s}
.flow-step:hover{background:rgba(59,130,246,.08);border-radius:4px}
.flow-step.active{background:rgba(59,130,246,.15);border-radius:4px}
.flow-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.flow-num.collector{background:#1e3a5f;color:#60a5fa;border:1px solid #3b82f6}
.flow-num.customer{background:#1a2a1a;color:#4ade80;border:1px solid #22c55e}
.flow-content{flex:1;min-width:0}
.flow-role{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.flow-role.collector{color:#60a5fa}
.flow-role.customer{color:#4ade80}
.flow-text{font-size:11px;color:var(--text);line-height:1.4;word-break:break-all}
.flow-meta{font-size:9px;color:var(--muted);margin-top:2px;display:flex;gap:4px;flex-wrap:wrap}
.flow-tag{display:inline-block;border-radius:9999px;padding:0 5px;font-size:9px;border:1px solid}
.flow-tag.action{border-color:#d29922;color:#d29922}
.flow-tag.willingness{border-color:#60a5fa;color:#60a5fa}
.flow-tag.fact{border-color:#22c55e;color:#4ade80}
.flow-tag.emotion{border-color:#a78bfa;color:#c4b5fd}
.flow-tag.gesture-open{border-color:#22c55e;color:#4ade80}
.flow-tag.gesture-end{border-color:#f59e0b;color:#fbbf24}
.flow-tag.score{border-color:#f59e0b;color:#fbbf24}
.flow-tag.score-high{border-color:#22c55e;color:#4ade80}
.flow-tag.score-low{border-color:#ef4444;color:#f87171}

#node-info h3{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px}
.ni-section{margin-bottom:12px}
.ni-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:4px}
.ni-tag{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:2px;font-size:11px}
.ni-tag.fact{border-color:var(--green);color:#4ade80}
.ni-tag.emotion{border-color:#a78bfa;color:#c4b5fd}
.ni-script{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin-bottom:3px;font-size:11px}
.ni-script .stxt{color:var(--text);margin-bottom:2px}
.ni-script .smeta{color:var(--muted);font-size:9px}
.ni-script .sbar{display:inline-block;width:40px;height:4px;background:#1e293b;border-radius:2px;vertical-align:middle;margin:0 3px;position:relative}
.ni-script .sbar-fill{position:absolute;top:0;left:0;height:100%;border-radius:2px}
.score-row{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div id="toolbar">
  <div id="logo">
    <svg viewBox="0 0 32 32" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="#3b82f6" stroke-width="2"/><circle cx="23" cy="8" r="5" stroke="#f59e0b" stroke-width="2"/><polygon points="8,18 14,30 2,30" stroke="#ef4444" stroke-width="2" fill="none"/><line x1="14" y1="8" x2="18" y2="8" stroke="#cbd5e1" stroke-width="2"/></svg>
    <span>Decision Tree</span>
  </div>
  <span class="stat" id="stats"></span>
  <div class="legend">
    <div class="legend-item"><div class="lbox opening"></div>Opening</div>
    <div class="legend-item"><div class="lbox decision"></div>Decision</div>
    <div class="legend-item"><div class="lbox emotion"></div>Emotion</div>
    <div class="legend-item"><div class="lbox action"></div>Action</div>
    <div class="legend-item"><div class="lbox ending"></div>Normal End</div>
    <div class="legend-item"><div class="lbox abrupt"></div>Abrupt End</div>
  </div>
</div>
<div id="main">
  <div id="cy"></div>
  <div id="detail">
    <div id="flow-panel">
      <div id="tracer">
        <div id="tracer-title">Dialog Tracer</div>
        <select id="dialog-select"><option value="">-- Select a dialog --</option></select>
        <div id="trace-controls">
          <button id="btn-start" onclick="goStart()">Start</button>
          <button id="btn-end" onclick="goEnd()">End</button>
          <button id="btn-view" onclick="toggleView()">View</button>
        </div>
        <div id="flow-title">Dialog Flow</div>
        <div id="flow"></div>
      </div>
    </div>
    <div id="info-panel">
      <div id="node-info"></div>
    </div>
  </div>
</div>
<script>
let cy, treeData, nodeMap={}, dialogData=[], currentDialog=null, tracePath=[], traceIdx=-1, playTimer=null, isPlaying=false, cachedTurnNodeMap=null, viewingDialog=false;

const CY_STYLE=[
  {selector:'node[type="opening"]',style:{'shape':'round-rectangle','width':280,'height':44,'background-color':'#052e16','border-color':'#22c55e','border-width':2,'label':'data(label)','text-halign':'center','text-valign':'center','color':'#4ade80','font-size':14,'font-weight':600,'font-family':'-apple-system,sans-serif','text-wrap':'wrap','text-max-width':260}},
  {selector:'node[type="decision"]',style:{'shape':'round-rectangle','width':280,'height':44,'background-color':'#1e3a5f','border-color':'#3b82f6','border-width':2,'label':'data(label)','text-halign':'center','text-valign':'center','color':'#60a5fa','font-size':13,'font-weight':600,'font-family':'-apple-system,sans-serif','text-wrap':'wrap','text-max-width':260}},
  {selector:'node[type="emotion"]',style:{'shape':'ellipse','width':200,'height':50,'background-color':'#2e1065','border-color':'#a78bfa','border-width':2,'label':'data(label)','text-halign':'center','text-valign':'center','color':'#c4b5fd','font-size':13,'font-weight':600,'font-family':'-apple-system,sans-serif'}},
  {selector:'node[type="action"]',style:{'shape':'diamond','width':200,'height':100,'background-color':'#422006','border-color':'#f59e0b','border-width':2,'label':'data(label)','text-halign':'center','text-valign':'center','color':'#fbbf24','font-size':13,'font-weight':600,'font-family':'-apple-system,sans-serif'}},
  {selector:'node[type="ending"]',style:{'shape':'ellipse','width':180,'height':60,'background-color':'#422006','border-color':'#f59e0b','border-width':2,'label':'data(label)','text-halign':'center','text-valign':'center','color':'#fbbf24','font-size':14,'font-weight':600,'font-family':'-apple-system,sans-serif'}},
  {selector:'node[type="abrupt"]',style:{'shape':'triangle','width':160,'height':80,'background-color':'#450a0a','border-color':'#ef4444','border-width':2,'label':'data(label)','text-halign':'center','text-valign':'center','color':'#f87171','font-size':12,'font-weight':600,'font-family':'-apple-system,sans-serif'}},
  {selector:'edge',style:{'width':2,'line-color':'#334155','target-arrow-color':'#334155','target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':1.4,'label':'data(label)','font-size':9,'font-weight':500,'color':'#64748b','text-rotation':'autorotate','text-margin-y':-5,'text-wrap':'wrap','text-max-width':100}},
  {selector:'edge.action-flow',style:{'width':1,'line-color':'#475569','target-arrow-color':'#475569','line-style':'dashed','label':'','curve-style':'bezier','arrow-scale':1.4}},
  {selector:'node.on-path',style:{'border-width':2,'border-color':'#94a3b8','background-opacity':1}},
  {selector:'edge.on-path',style:{'width':2,'line-color':'#60a5fa','target-arrow-color':'#60a5fa','color':'#60a5fa'}},
  {selector:'node.off-path',style:{'opacity':0.2}},
  {selector:'edge.off-path',style:{'opacity':0.1}},
  {selector:'node.highlighted',style:{'border-width':3,'border-color':'#ffffff','background-color':'#1e3a5f'}},
  {selector:'edge.edge-highlighted',style:{'width':3,'line-color':'#fbbf24','target-arrow-color':'#fbbf24','color':'#fbbf24','line-style':'solid'}},
];

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function nodeType(node,depth){
  if(depth===0) return 'opening';
  if(node.state_id==='abrupt_end') return 'abrupt';
  if(node.state_id==='normal_end') return 'ending';
  const bk=node.branch_key||{};
  const hasFacts=bk.facts&&bk.facts.length>0;
  const hasEmotions=bk.emotions&&bk.emotions.length>0;
  if(!hasFacts&&hasEmotions) return 'emotion';
  if(bk.action) return 'action';
  return 'decision';
}

function indexTree(node,parentId=null,depth=0){
  const id=node.state_id+'_'+Math.random().toString(36).slice(2,6);
  node._id=id;node._parentId=parentId;node._depth=depth;node._type=nodeType(node,depth);
  nodeMap[id]=node;
  (node.children||[]).forEach(c=>indexTree(c,id,depth+1));
}

function treeToCytoscape(node,pid=null,depth=0){
  const id=node._id, type=node._type, pool=node.sentence_pool||[], kids=node.children||[];
  let label=node.state_id.replace(/^[afe]:/,'');
  const cyNodes=[{data:{id,label,type,nodeRef:id,poolSize:pool.length}}];
  const cyEdges=[];
  const crossEdges=[];
  if(pid!==null){
    const bk=node.branch_key||{};
    let bl='';
    if(bk.facts&&bk.facts.length) bl+=bk.facts.join(', ');
    if(bk.emotions&&bk.emotions.length) bl+=(bl?' | ':'')+bk.emotions.join(', ');
    if(bk.action) bl=bk.action;
    if(bk.abrupt) bl='abrupt';
    if(bk.end_type==='normal') bl='normal end';
    if(bk.end_type==='abrupt') bl='abrupt end';
    if(!bl) bl='∅';
    cyEdges.push({data:{source:pid,target:id,label:bl,weight:1}});
  }
  for(const child of kids){
    const sub=treeToCytoscape(child,id,depth+1);
    cyNodes.push(...sub.nodes);
    cyEdges.push(...sub.edges);
    crossEdges.push(...sub.crossEdges);
  }
  const actionKids=kids.filter(c=>c._type==='action');
  const nonActionKids=kids.filter(c=>c._type!=='action');
  if(actionKids.length&&nonActionKids.length){
    for(const ak of actionKids){
      for(const nak of nonActionKids){
        crossEdges.push({data:{source:ak._id,target:nak._id,label:'',weight:0,classes:'action-flow'}});
      }
    }
  }
  return {nodes:cyNodes,edges:cyEdges,crossEdges,leafActions:[]};
}

function addLeafToEndEdges(elements,crossEdges,treeData){
  const normalEnd=Object.values(nodeMap).find(n=>n.state_id==='normal_end');
  const abruptEnd=Object.values(nodeMap).find(n=>n.state_id==='abrupt_end');
  if(!normalEnd||!abruptEnd) return;
  const normalId=normalEnd._id, abruptId=abruptEnd._id;
  const existingEdges=new Set(elements.edges.map(e=>e.data.source+'->'+e.data.target));
  for(const node of Object.values(nodeMap)){
    if(node._type==='action'&&!node.children?.length){
      const srcId=node._id;
      const hasClosing=(node.sentence_pool||[]).some(s=>s.collector_action==='closure'||s.collector_action==='goodbye');
      const endId=hasClosing?normalId:abruptId;
      const ek=srcId+'->'+endId;
      if(!existingEdges.has(ek)){
        crossEdges.push({data:{source:srcId,target:endId,label:'',weight:0,classes:'action-flow'}});
        existingEdges.add(ek);
      }
    }
  }
}

function buildGraph(elements,crossEdges){
  if(cy) cy.destroy();
  cy=cytoscape({
    container:document.getElementById('cy'),
    elements,
    style:CY_STYLE,
    layout:{name:'dagre',rankDir:'TB',spacingFactor:1.2,nodeSep:30,rankSep:120},
    userZoomingEnabled:true,userPanningEnabled:true,boxSelectionEnabled:false,
  });
  if(crossEdges&&crossEdges.length) cy.add(crossEdges.map(e=>({group:'edges',data:e.data,classes:e.data.classes||''})));
  applyDepthSpacing();
  cy.on('tap','node',function(e){
    const node=e.target;
    const refId=node.data('nodeRef');
    cy.edges().removeClass('edge-highlighted');
    node.connectedEdges().addClass('edge-highlighted');
    if(refId) showNodeInfo(nodeMap[refId]);
  });
  cy.on('tap','edge',function(){cy.edges().removeClass('edge-highlighted');});
  cy.on('tap',function(e){if(e.target===cy){cy.edges().removeClass('edge-highlighted');document.getElementById('info-panel').classList.remove('open');}});
}

function applyDepthSpacing(){
  const sep=120;
  assignFullLayout(sep);
  const endIds=new Set();
  cy.nodes().forEach(n=>{if(n.data('type')==='ending'||n.data('type')==='abrupt') endIds.add(n.id());});
  let maxY=0;
  cy.nodes().forEach(n=>{if(!endIds.has(n.id())&&n.position('y')>maxY) maxY=n.position('y');});
  const endY=maxY+sep*2;
  let minX=Infinity, maxX=-Infinity;
  cy.nodes().forEach(n=>{if(!endIds.has(n.id())){if(n.position('x')<minX)minX=n.position('x');if(n.position('x')>maxX)maxX=n.position('x');}});
  const centerX=(minX+maxX)/2;
  const endNodes=cy.nodes().filter(n=>endIds.has(n.id()));
  const endCount=endNodes.length;
  const endSpacing=200;
  const startX=centerX-(endCount-1)*endSpacing/2;
  endNodes.forEach((n,i)=>{
    n.position({x:startX+i*endSpacing,y:endY});
  });
}

function assignFullLayout(sep){
  const depthGroups={};
  cy.nodes().forEach(n=>{
    const refId=n.data('nodeRef');
    const ref=refId?nodeMap[refId]:null;
    const d=ref?ref._depth:0;
    if(!(d in depthGroups)) depthGroups[d]=[];
    depthGroups[d].push(n);
  });
  const sortedDepths=Object.keys(depthGroups).map(Number).sort((a,b)=>a-b);
  const depthY={};
  for(let i=0;i<sortedDepths.length;i++){
    const d=sortedDepths[i];
    if(i===0) depthY[d]=0;
    else{
      const prevD=sortedDepths[i-1];
      const mult=prevD===0?3:prevD<=2?2:1;
      const extra=prevD>=3?0.5:0;
      depthY[d]=depthY[prevD]+sep*(mult+extra);
    }
  }
  for(const d of sortedDepths){
    const y=depthY[d];
    depthGroups[d].forEach(n=>{
      n.position({x:n.position('x'),y:y});
    });
  }
  enforceParentAboveChild(sep);
}

function enforceParentAboveChild(sep){
  const treeEdges=cy.edges().filter(e=>!e.hasClass('action-flow'));
  const nodeTreeDepth={};
  cy.nodes().forEach(n=>{
    const refId=n.data('nodeRef');
    const ref=refId?nodeMap[refId]:null;
    nodeTreeDepth[n.id()]=ref?ref._depth:0;
  });
  const nodeY={};
  cy.nodes().forEach(n=>{nodeY[n.id()]=n.position('y');});
  const forwardEdges=treeEdges.filter(e=>{
    const src=e.data('source'),tgt=e.data('target');
    return (nodeTreeDepth[tgt]||0)>(nodeTreeDepth[src]||0);
  });
  let changed=true;
  let iterations=0;
  while(changed&&iterations<50){
    changed=false;
    iterations++;
    forwardEdges.forEach(e=>{
      const src=e.data('source'),tgt=e.data('target');
      if(nodeY[tgt]<=nodeY[src]){
        nodeY[tgt]=nodeY[src]+sep;
        changed=true;
      }
    });
  }
  cy.nodes().forEach(n=>{
    const y=nodeY[n.id()];
    if(y!==undefined&&y!==n.position('y')){
      n.position({x:n.position('x'),y:y});
    }
  });
}

function makeBranchKey(state){
  if(!state) return {};
  const key={};
  if(state.facts&&state.facts.length) key.facts=[...state.facts].sort();
  if(state.emotions&&state.emotions.length) key.emotions=[...state.emotions].sort();
  return key;
}

function findChildByFact(node, fact){
  for(const c of (node.children||[])){
    const f=c.branch_key?.facts;
    if(f&&f.length===1&&f[0]===fact) return c;
  }
  return null;
}

function findChildByEmotion(node, emotion){
  for(const c of (node.children||[])){
    const e=c.branch_key?.emotions;
    if(e&&e.includes(emotion)&&!c.branch_key?.facts?.length) return c;
  }
  return null;
}

function findChildByFactAndEmotion(node, fact, emotion){
  for(const c of (node.children||[])){
    const f=c.branch_key?.facts;
    const e=c.branch_key?.emotions;
    if(f&&f.length===1&&f[0]===fact&&e&&e.length===1&&e[0]===emotion) return c;
  }
  return null;
}

function findChildByAction(node, action){
  for(const c of (node.children||[])){
    if(c.branch_key?.action===action) return c;
  }
  return null;
}

function findChildWithSentence(node, scriptId){
  for(const c of (node.children||[])){
    if((c.sentence_pool||[]).some(s=>s.script_id===scriptId)) return c;
  }
  return null;
}

function traceDialogPath(callId){
  const dlg=dialogData.find(d=>d.call_id===callId);
  if(!dlg) return [];

  const path=[];
  const turnNodeMap={};
  let currentNode=treeData;
  let contextNode=treeData;
  path.push(currentNode._id);
  turnNodeMap[0]=currentNode._id;

  for(let i=1;i<dlg.turns.length;i++){
    const t=dlg.turns[i];
    const facts=(t.facts||[]).sort();
    const emotions=(t.emotions||[]).sort();
    const action=t.action;

    if(t.role==='客户'){
      const knownFacts=new Set(contextNode.inherited_facts||[]);
      for(const fact of facts){
        if(knownFacts.has(fact)) continue;
        let child=findChildByFact(contextNode, fact);
        if(!child){
          for(const c of (contextNode.children||[])){
            child=findChildByFact(c, fact);
            if(child){if(!path.includes(c._id))path.push(c._id);contextNode=c;break;}
          }
        }
        if(!child) child=findChildByFact(currentNode, fact);
        if(child){
          if(!path.includes(child._id)) path.push(child._id);
          currentNode=child;
          contextNode=child;
          knownFacts.add(fact);
        }
      }

      for(const emotion of emotions){
        let child=findChildByEmotion(contextNode, emotion);
        if(!child){
          for(const c of (contextNode.children||[])){
            child=findChildByEmotion(c, emotion);
            if(child){if(!path.includes(c._id))path.push(c._id);contextNode=c;break;}
          }
        }
        if(!child&&facts.length){
          const lastFact=facts[facts.length-1];
          child=findChildByFactAndEmotion(contextNode, lastFact, emotion);
        }
        if(!child) child=findChildByEmotion(currentNode, emotion);
        if(child){
          if(!path.includes(child._id)) path.push(child._id);
          currentNode=child;
          contextNode=child;
        }
      }

      turnNodeMap[i]=currentNode._id;
    } else if(t.role==='催收员'){
      if(action){
        let child=findChildByAction(contextNode, action);
        if(child){
          if(!path.includes(child._id)) path.push(child._id);
          currentNode=child;
        }
      }
      turnNodeMap[i]=currentNode._id;
    } else {
      turnNodeMap[i]=currentNode._id;
    }
  }

  const hasClosing=dlg.turns.some(t=>t.action==='closure'||t.action==='goodbye');
  const endNode=Object.values(nodeMap).find(n=>n.state_id===(hasClosing?'normal_end':'abrupt_end'));
  if(endNode&&!path.includes(endNode._id)) path.push(endNode._id);

  cachedTurnNodeMap=turnNodeMap;
  return path;
}

function buildDialogEdges(callId){
  const dlg=dialogData.find(d=>d.call_id===callId);
  if(!dlg) return [];

  const seq=[];
  let currentNode=treeData;
  let contextNode=treeData;
  seq.push(currentNode._id);

  for(let i=1;i<dlg.turns.length;i++){
    const t=dlg.turns[i];
    const facts=(t.facts||[]).sort();
    const emotions=(t.emotions||[]).sort();
    const action=t.action;

    if(t.role==='客户'){
      const knownFacts=new Set(contextNode.inherited_facts||[]);
      for(const fact of facts){
        if(knownFacts.has(fact)) continue;
        let child=findChildByFact(contextNode, fact);
        if(!child){
          for(const c of (contextNode.children||[])){
            child=findChildByFact(c, fact);
            if(child){seq.push(c._id);contextNode=c;break;}
          }
        }
        if(!child) child=findChildByFact(currentNode, fact);
        if(child){seq.push(child._id);currentNode=child;contextNode=child;knownFacts.add(fact);}
      }
      for(const emotion of emotions){
        let child=findChildByEmotion(contextNode, emotion);
        if(!child){
          for(const c of (contextNode.children||[])){
            child=findChildByEmotion(c, emotion);
            if(child){seq.push(c._id);contextNode=c;break;}
          }
        }
        if(!child&&facts.length){
          const lastFact=facts[facts.length-1];
          child=findChildByFactAndEmotion(contextNode, lastFact, emotion);
        }
        if(!child) child=findChildByEmotion(currentNode, emotion);
        if(child){seq.push(child._id);currentNode=child;contextNode=child;}
      }
    } else if(t.role==='催收员'){
      if(action){
        let child=findChildByAction(contextNode, action);
        if(child){seq.push(child._id);currentNode=child;}
      }
    }
  }

  const hasClosing=dlg.turns.some(t=>t.action==='closure'||t.action==='goodbye');
  const endNode=Object.values(nodeMap).find(n=>n.state_id===(hasClosing?'normal_end':'abrupt_end'));
  if(endNode) seq.push(endNode._id);

  return seq;
}

function toggleView(){
  if(viewingDialog){
    viewingDialog=false;
    document.getElementById('btn-view').classList.remove('active');
    const{nodes,edges,crossEdges}=treeToCytoscape(treeData);
    buildGraph({nodes,edges},crossEdges);
    return;
  }
  if(!currentDialog||!tracePath.length) return;
  viewingDialog=true;
  document.getElementById('btn-view').classList.add('active');
  buildViewGraph();
  cy.nodes().addClass('on-path');
  cy.edges().addClass('on-path');
}

function buildViewGraph(){
  const seq=buildDialogEdges(currentDialog.call_id).filter(id=>nodeMap[id]);
  if(!seq.length) return;
  const sep=320;
  const seen=new Set();
  const cyNodes=[];
  const cyEdges=[];
  const nodeRow={};
  let row=0;
  for(let i=0;i<seq.length;i++){
    const id=seq[i];
    const ref=nodeMap[id];
    if(!ref) continue;
    const isFirst=!seen.has(id);
    seen.add(id);
    if(isFirst){
      const label=ref.state_id.replace(/^[afe]:/,'');
      cyNodes.push({data:{id,label,type:ref._type,nodeRef:id,poolSize:(ref.sentence_pool||[]).length}});
      nodeRow[id]=row;
      row++;
    }
  }
  for(let i=1;i<seq.length;i++){
    const src=seq[i-1],tgt=seq[i];
    if(!nodeMap[src]||!nodeMap[tgt]) continue;
    const ek=src+'->'+tgt;
    if(cyEdges.some(e=>e.data.source===src&&e.data.target===tgt)) continue;
    const ref=nodeMap[tgt];
    const bk=ref?.branch_key||{};
    let bl='';
    if(bk.facts&&bk.facts.length) bl+=bk.facts.join(', ');
    if(bk.emotions&&bk.emotions.length) bl+=(bl?' | ':'')+bk.emotions.join(', ');
    if(bk.action) bl=bk.action;
    if(!bl) bl='∅';
    const isBack=nodeRow[tgt]<=nodeRow[src];
    cyEdges.push({data:{source:src,target:tgt,label:bl},classes:isBack?'back-edge':''});
  }
  if(cy) cy.destroy();
  cy=cytoscape({
    container:document.getElementById('cy'),
    elements:{nodes:cyNodes,edges:cyEdges},
    style:CY_STYLE.concat([
      {selector:'edge.back-edge',style:{'line-style':'dashed','line-color':'#94a3b8','target-arrow-color':'#94a3b8','width':1.5}},
    ]),
    layout:{name:'preset'},
    userZoomingEnabled:true,userPanningEnabled:true,boxSelectionEnabled:false,
  });
  const rowNodes={};
  cy.nodes().forEach(n=>{
    const r=nodeRow[n.id()];
    if(r!==undefined){
      n.position({x:0,y:r*sep});
      if(!rowNodes[r]) rowNodes[r]=[];
      rowNodes[r].push(n);
    }
  });
  for(const r in rowNodes){
    const group=rowNodes[r];
    if(group.length>1){
      const spacing=280;
      const startX=-(group.length-1)*spacing/2;
      group.forEach((n,i)=>{
        n.position({x:startX+i*spacing,y:n.position('y')});
      });
    }
  }
  const backEdgeSources=new Set();
  cy.edges().filter(e=>e.hasClass('back-edge')).forEach(e=>{
    backEdgeSources.add(e.data('source'));
  });
  const maxXByRow={};
  cy.nodes().forEach(n=>{
    const r=nodeRow[n.id()];
    if(r!==undefined){
      const x=n.position('x');
      if(!maxXByRow[r]||x>maxXByRow[r]) maxXByRow[r]=x;
    }
  });
  backEdgeSources.forEach(srcId=>{
    const srcNode=cy.getElementById(srcId);
    if(srcNode&&srcNode.length){
      const r=nodeRow[srcId];
      const offset=(maxXByRow[r]||0)+280;
      srcNode.position({x:offset,y:srcNode.position('y')});
    }
  });
  cy.fit(undefined,80);
  cy.on('tap','node',function(e){
    const node=e.target;
    const refId=node.data('nodeRef');
    cy.edges().removeClass('edge-highlighted');
    node.connectedEdges().addClass('edge-highlighted');
    if(refId) showNodeInfo(nodeMap[refId]);
  });
  cy.on('tap','edge',function(){cy.edges().removeClass('edge-highlighted');});
  cy.on('tap',function(e){if(e.target===cy){cy.edges().removeClass('edge-highlighted');document.getElementById('info-panel').classList.remove('open');}});
}

function highlightPath(path){
  cy.elements().removeClass('on-path off-path highlighted');
  cy.elements().style('opacity','');
  if(!path||path.length===0){
    cy.elements().style('opacity','');
    return;
  }
  const pathSet=new Set(path);
  cy.nodes().forEach(n=>{
    if(pathSet.has(n.id())) n.addClass('on-path');
    else n.addClass('off-path');
  });
  cy.edges().forEach(e=>{
    if(pathSet.has(e.data('source'))&&pathSet.has(e.data('target'))) e.addClass('on-path');
    else e.addClass('off-path');
  });
  const pathEles=cy.nodes().filter(n=>pathSet.has(n.id()));
  cy.animate({center:{eles:pathEles}},{duration:400});
}

function renderFlow(dialog){
  const flow=document.getElementById('flow');
  if(!dialog){flow.innerHTML='<div style="color:#64748b;font-size:11px;padding:8px">Select a dialog to trace</div>';return;}
  let h='';
  dialog.turns.forEach((t,i)=>{
    const isCollector=t.role==='催收员';
    const cls=isCollector?'collector':'customer';
    let meta='';
    if(t.action) meta+=`<span class="flow-tag action">${esc(t.action)}</span>`;
    if(t.willingness) meta+=`<span class="flow-tag willingness">${esc(t.willingness)}</span>`;
    if(t.gesture_type==='opening') meta+=`<span class="flow-tag gesture-open">OPENING</span>`;
    if(t.gesture_type==='ending') meta+=`<span class="flow-tag gesture-end">ENDING</span>`;
    (t.facts||[]).forEach(f=>meta+=`<span class="flow-tag fact">${esc(f)}</span>`);
    (t.emotions||[]).forEach(e=>meta+=`<span class="flow-tag emotion">${esc(e)}</span>`);
    h+=`<div class="flow-step" data-idx="${i}" onclick="goStep(${i})">`;
    h+=`<div class="flow-num ${cls}">${i+1}</div>`;
    h+=`<div class="flow-content">`;
    h+=`<div class="flow-role ${cls}">${isCollector?'Collector':'Customer'}</div>`;
    h+=`<div class="flow-text">${esc(t.text)}</div>`;
    if(meta) h+=`<div class="flow-meta">${meta}</div>`;
    h+=`</div></div>`;
  });
  flow.innerHTML=h;
}

function selectDialog(callId){
  stopPlay();
  cachedTurnNodeMap=null;
  if(viewingDialog) toggleView();
  currentDialog=dialogData.find(d=>d.call_id===callId)||null;
  if(!currentDialog){
    tracePath=[];traceIdx=-1;
    highlightPath(null);
    renderFlow(null);
    document.getElementById('node-info').innerHTML='';
    document.getElementById('info-panel').classList.remove('open');
    document.getElementById('btn-end').classList.remove('abrupt');
    return;
  }
  tracePath=traceDialogPath(callId);
  traceIdx=-1;
  highlightPath(tracePath);
  renderFlow(currentDialog);

  const hasClosing=currentDialog.turns.some(t=>t.action==='closure'||t.action==='goodbye');
  const endBtn=document.getElementById('btn-end');
  endBtn.classList.toggle('abrupt',!hasClosing);
  endBtn.textContent=hasClosing?'End':'Abrupt End';
}

function buildTurnNodeMap(){
  if(cachedTurnNodeMap) return cachedTurnNodeMap;
  return {};
}

function stopPlay(){
  if(playTimer){clearTimeout(playTimer);playTimer=null;}
  isPlaying=false;
  document.getElementById('btn-start').classList.remove('playing');
  document.getElementById('btn-start').textContent='Start';
}

function goStart(){
  if(!currentDialog) return;
  if(isPlaying){stopPlay();return;}
  isPlaying=true;
  document.getElementById('btn-start').classList.add('playing');
  document.getElementById('btn-start').textContent='Pause';
  traceIdx=-1;
  advanceStep();
}

function advanceStep(){
  if(!isPlaying||!currentDialog) return;
  traceIdx++;
  if(traceIdx>=currentDialog.turns.length){
    stopPlay();
    return;
  }
  activateStep(traceIdx);
  playTimer=setTimeout(()=>{requestAnimationFrame(advanceStep);}, 1400);
}

function goEnd(){
  stopPlay();
  if(!currentDialog) return;
  traceIdx=currentDialog.turns.length-1;
  activateStep(traceIdx);
}

function activateStep(idx){
  if(!currentDialog) return;
  const turnMap=buildTurnNodeMap();
  const nodeId=turnMap[idx];

  document.querySelectorAll('.flow-step').forEach(el=>el.classList.remove('active'));
  const stepEl=document.querySelector(`.flow-step[data-idx="${idx}"]`);
  if(stepEl){
    stepEl.classList.add('active');
    const flowContainer=document.getElementById('flow');
    const stepTop=stepEl.offsetTop - flowContainer.offsetTop;
    flowContainer.scrollTop = stepTop - 40;
  }

  if(nodeId){
    const cyNode=cy.getElementById(nodeId);
    if(cyNode&&cyNode.length>0){
      cy.nodes().removeClass('highlighted');
      cyNode.addClass('highlighted');
      cy.center(cyNode);
    }
    showNodeInfo(nodeMap[nodeId]);
  }
}

function goStep(idx){
  stopPlay();
  traceIdx=idx;
  activateStep(idx);
}

function showNodeInfo(node){
  const panel=document.getElementById('info-panel');
  if(!node){panel.classList.remove('open');document.getElementById('node-info').innerHTML='';return;}
  panel.classList.add('open');
  if(cachedTurnNodeMap&&node._id){
    const matchingTurns=Object.entries(cachedTurnNodeMap).filter(([idx,nid])=>nid===node._id).map(([idx])=>parseInt(idx));
    if(matchingTurns.length){
      const firstIdx=matchingTurns[0];
      const stepEl=document.querySelector(`.flow-step[data-idx="${firstIdx}"]`);
      if(stepEl){
        document.querySelectorAll('.flow-step').forEach(el=>el.classList.remove('active'));
        matchingTurns.forEach(idx=>{
          const el=document.querySelector(`.flow-step[data-idx="${idx}"]`);
          if(el) el.classList.add('active');
        });
        const flowPanel=document.getElementById('flow-panel');
        flowPanel.scrollTo({top:stepEl.offsetTop-flowPanel.offsetTop-20,behavior:'smooth'});
      }
    }
  }
  const ni=document.getElementById('node-info');
  const type=node._type;
  const tl={opening:'Opening (Start)',decision:'Decision Point',emotion:'Emotion',action:'Collector Action',ending:'Normal End',abrupt:'Abrupt End'};
  let h=`<h3>${esc(node.state_id)}</h3>`;
  h+=`<div class="ni-section"><div class="ni-title">Type</div>${tl[type]||type}</div>`;
  const bk=node.branch_key||{};
  h+=`<div class="ni-section"><div class="ni-title">Branch Key</div>`;
  (bk.facts||[]).forEach(f=>h+=`<span class="ni-tag fact">${esc(f)}</span>`);
  (bk.emotions||[]).forEach(e=>h+=`<span class="ni-tag emotion">${esc(e)}</span>`);
  if(!bk.facts?.length&&!bk.emotions?.length&&!bk.abrupt&&!bk.end_type) h+=`<span style="color:#64748b">∅</span>`;
  h+=`</div>`;
  const inf=node.inherited_facts||[];
  h+=`<div class="ni-section"><div class="ni-title">Inherited Facts</div>`;
  if(inf.length) inf.forEach(f=>h+=`<span class="ni-tag fact">${esc(f)}</span>`);
  else h+=`<span style="color:#64748b">∅</span>`;
  h+=`</div>`;
  const pool=node.sentence_pool||[];
  h+=`<div class="ni-section"><div class="ni-title">Sentences (${pool.length})</div>`;
  pool.slice(0,10).forEach(s=>{
    let tags='';
    if(s.collector_action) tags+=`<span class="flow-tag action" style="margin-right:3px">${esc(s.collector_action)}</span>`;
    if(s.customer_willingness) tags+=`<span class="flow-tag willingness" style="margin-right:3px">${esc(s.customer_willingness)}</span>`;
    const fc=s.fact_context||[];
    if(fc.length) tags+=fc.map(f=>`<span class="flow-tag fact" style="margin-right:3px">${esc(f)}</span>`).join('');
    let scores='';
    if(s.win_rate!==undefined){
      const wr=s.win_rate;
      const wrCls=wr>=0.6?'score-high':wr<0.4?'score-low':'score';
      const wrPct=Math.round(wr*100);
      scores+=`<span class="score-row"><span>HWR</span><span class="sbar"><span class="sbar-fill" style="width:${wrPct}%;background:${wr>=0.6?'#22c55e':wr<0.4?'#ef4444':'#f59e0b'}"></span></span><span>${wrPct}%</span></span>`;
    }
    if(s.sas!==undefined){
      const sa=s.sas;
      const saPct=Math.round(sa*100);
      scores+=`<span class="score-row"><span>SAS</span><span class="sbar"><span class="sbar-fill" style="width:${saPct}%;background:${sa>=0.7?'#22c55e':sa<0.4?'#ef4444':'#f59e0b'}"></span></span><span>${saPct}%</span></span>`;
    }
    if(s.bg_bitmask_int!==undefined){
      scores+=`<span class="score-row"><span>CTX</span><span>0b${s.bg_bitmask_int.toString(2).padStart(5,'0')}</span></span>`;
    }
    h+=`<div class="ni-script">${tags}<span class="stxt">${esc(s.script_text)}</span>${scores}<div class="smeta">${esc(s.script_id)}</div></div>`;
  });
  if(pool.length>10) h+=`<div style="color:#64748b;font-size:10px">...and ${pool.length-10} more</div>`;
  h+=`</div>`;
  ni.innerHTML=h;
}

function countNodes(n){return 1+(n.children||[]).reduce((s,c)=>s+countNodes(c),0);}

Promise.all([
  fetch('../f005_context_scoring/decision_tree_scored.json?_='+Date.now()).then(r=>r.json()),
  fetch('../f004_decision_tree/dialog_records.json?_='+Date.now()).then(r=>r.json()),
]).then(([tree,dialogs])=>{
  treeData=tree;
  dialogData=dialogs;
  indexTree(tree);
  const{nodes,edges,crossEdges}=treeToCytoscape(tree);
  addLeafToEndEdges({nodes,edges},crossEdges,tree);
  const total=countNodes(tree);
  document.getElementById('stats').textContent=`${total} nodes · ${dialogs.length} dialogs · 1 opening · 1 normal end · 1 abrupt end`;
  buildGraph({nodes,edges},crossEdges,{0:3,1:3,2:2});

  const sel=document.getElementById('dialog-select');
  dialogs.forEach((d,i)=>{
    const opt=document.createElement('option');
    opt.value=d.call_id;
    const hasClosing=d.turns.some(t=>t.action==='closure'||t.action==='goodbye');
    opt.textContent=`${i+1}. ${d.call_id.slice(-6)} (${d.turns.length} turns${hasClosing?' → normal':' → abrupt'})`;
    sel.appendChild(opt);
  });
  sel.addEventListener('change',()=>selectDialog(sel.value));
  renderFlow(null);
});
