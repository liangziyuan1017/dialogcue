# Knowledge Object Schema
# Extended metadata for knowledge entries with multi-axis authority model.
# Extends frontmatter.schema.yaml with the knowledge: block.
# Phase 4 status: Schema defined.

schema_version: 1
module_version: "0.1.0"

# The knowledge: block — added to any doc's frontmatter when it represents durable knowledge
knowledge:
  artifact_type:
    description: What kind of knowledge is this?
    enum:
      - episode       # A specific event or interaction
      - method        # A reusable technique or process
      - skill         # A capability definition
      - proposal      # A proposed change or new idea
      - eval          # An evaluation or assessment result
      - lesson        # A lesson learned (LL-XXX)
      - log           # A log entry or record

  domain:
    description: What domain does this knowledge belong to?
    enum:
      - development
      - ops
      - product
      - design
      - general

  scope:
    description: Who can access this knowledge?
    enum:
      - agent-local    # Only the creating agent
      - team-shared    # All agents on this project

  # ── Three Orthogonal Axes (the #1 pattern from F163) ──

  authority:
    description: How trusted is this knowledge?
    enum:
      - observed       # Noted but not yet validated
      - candidate      # Proposed as potentially valid
      - validated      # Confirmed through evidence or testing
      - constitutional # Foundational — loaded into every agent's system prompt
    default: observed

  activation:
    description: When is this knowledge loaded?
    enum:
      - query          # Only when explicitly searched
      - scoped         # Loaded in specific contexts
      - always_on      # Permanently active in agent context
      - backstop       # Preserved but not prominent in default search
    default: query

  status:
    description: Is this knowledge current?
    enum:
      - active         # Currently valid and in use
      - review         # Under re-evaluation
      - invalidated    # Proven incorrect
      - archived       # Retired but preserved for reference
    default: active

  replaced_by:
    description: Which document or knowledge entry replaced this one?
    type: string

  trust_level:
    description: How confident are we in this knowledge?
    enum:
      - experimental   # First observation, untested
      - tested         # Verified in at least one context
      - validated      # Confirmed across multiple contexts
      - production     # Battle-tested in production
    default: experimental

  # ── Provenance ──

  source_ids:
    description: What proved this knowledge? (ADR IDs, lesson IDs, commit SHAs)
    type: list
    min_items: 1

  evolved_from:
    description: What did this knowledge replace or refine?
    type: list

  superseded_by:
    description: What replaced this knowledge?
    type: list

  # ── Lifecycle ──

  created:
    description: When was this knowledge first recorded?
    type: date
    required: true

  last_activated:
    description: When was this knowledge last used or referenced?
    type: date

  activation_count:
    description: How many times has this knowledge been referenced?
    type: integer
    default: 0

  stale_after_days:
    description: Days of inactivity before this knowledge is flagged for review
    type: integer
    default: 90

  review_cycle_days:
    description: How often should this knowledge be re-evaluated?
    type: integer
    default: 90

  # ── Privacy ──

  exportability:
    description: Can this knowledge leave the project?
    enum:
      - private        # Never export
      - project_only   # Only within this project
      - generalized    # Safe for cross-project reflux
    default: project_only

  contains_sensitive_data:
    description: Does this entry contain credentials, PII, or secrets?
    type: boolean
    default: false
