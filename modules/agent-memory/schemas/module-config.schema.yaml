# Module Configuration Schema
# Full configuration for the agent-memory module.
# Phase 4 status: Schema defined. Defaults are safe for zero-dependency use.

schema_version: 1
module_version: "0.1.0"

# ── Memory Backend ──

memory:
  backend:
    description: Which storage backend to use
    enum: [filesystem, sqlite, memory]
    default: filesystem
  storage_path:
    description: Where index files are stored (relative to module root)
    type: string
    default: "./memory"

# ── Search Configuration ──

search:
  default_mode:
    description: Default retrieval mode
    enum: [lexical, semantic, hybrid]
    default: hybrid
  hybrid:
    lexical_weight:
      description: Weight of BM25/FTS5 results in RRF fusion
      type: float
      default: 0.3
      min: 0.0
      max: 1.0
    semantic_weight:
      description: Weight of vector NN results in RRF fusion
      type: float
      default: 0.7
      min: 0.0
      max: 1.0
    rrf_k:
      description: RRF rank fusion constant (higher = more diversity)
      type: integer
      default: 60
  fail_open:
    description: If semantic search is unavailable, degrade to lexical instead of failing
    type: boolean
    default: true

# ── Embedding Service (optional) ──

embedding:
  enabled:
    description: Enable semantic search via embedding service
    type: boolean
    default: false
  endpoint:
    description: Embedding API endpoint
    type: string
    default: "http://localhost:9880/v1/embeddings"
  model:
    description: Embedding model name
    type: string
    default: "Qwen3-Embedding-0.6B"
  dim:
    description: Embedding vector dimension
    type: integer
    default: 768

# ── Summarization (optional) ──

summarization:
  enabled:
    description: Enable L1 periodic LLM summaries
    type: boolean
    default: false
  llm_endpoint:
    description: OpenAI-compatible API endpoint
    type: string
    default: "https://api.openai.com/v1"
  llm_model:
    description: Model to use for summarization
    type: string
    default: "gpt-4o"
  interval_minutes:
    description: How often to check for summarizable threads
    type: integer
    default: 30
  eligibility:
    quiet_window_min:
      description: Minutes of inactivity before a thread is eligible
      type: integer
      default: 10
    min_messages:
      description: Minimum messages before summarization
      type: integer
      default: 20
    cooldown_hours:
      description: Minimum hours between summaries for the same thread
      type: integer
      default: 2

# ── Feature Flags ──

features:
  auto_index_on_change:
    description: Automatically rebuild index when docs change
    type: boolean
    default: true
  tombstone_retention_days:
    description: Days before physical deletion of tombstoned entries
    type: integer
    default: 90
  knowledge_feed:
    description: Auto-extract durable knowledge from conversations
    type: boolean
    default: false
  cross_project_reflux:
    description: Promote learned methodology to global layer for other projects
    type: boolean
    default: false
