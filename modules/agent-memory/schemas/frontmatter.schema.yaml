# Frontmatter Schema
# Required metadata contract for every document in the project's docs/
# Phase 4 status: Schema defined. All docs must validate against this.

schema_version: 1
module_version: "0.1.0"

required_fields:
  - id            # Unique identifier (e.g. ADR-001, LL-042, F001)
  - title         # Human-readable title
  - doc_kind      # Document type
  - created       # Creation date (YYYY-MM-DD)
  - schema_version # Schema version this doc was written against

optional_fields:
  - feature_ids   # Related feature IDs (e.g. [F001, F102])
  - topics        # Loose topic tags (e.g. [memory, retrieval])
  - status        # Current status
  - updated       # Last update date (YYYY-MM-DD)
  - related       # Related document IDs
  - supersedes    # IDs this document replaces
  - replaced_by   # ID that replaces this document
doc_kind_enum:
  - decision      # Architecture Decision Record
  - lesson        # Lesson learned (LL-XXX)
  - spec          # Feature specification
  - plan          # Implementation plan
  - discussion    # Discussion record
  - research      # Technical research
  - bug-report    # Bug report
  - review        # Review request/response
  - note          # General note
  - summary       # Conversation or project summary

status_enum:
  - draft         # Work in progress / proposed but not accepted
  - review        # Under review
  - accepted      # Accepted / active
  - deprecated    # No longer current
  - superseded    # Replaced by another document
  - archived      # Historical record
