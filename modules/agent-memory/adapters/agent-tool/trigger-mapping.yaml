# Adapter Trigger Mapping: agent-memory -> agent_tool
# Phase 2 note: host-side trigger hints only.
# This file is PURE ROUTING — no execution logic and no workflow pointers.

mappings:
  memory-search:
    triggers:
      - "search memory"
      - "find decision"
      - "what did we decide about"
      - "recall"
      - "has this happened before"
      - "memory search"
      - "search for"
    capability: Search durable project memory for prior decisions, lessons, and validated knowledge

  decision-record:
    triggers:
      - "record this decision"
      - "create ADR"
      - "architecture decision"
      - "record decision"
      - "document this choice"
    capability: Record or update a durable architecture or design decision

  lesson-capture:
    triggers:
      - "lesson learned"
      - "don't repeat this"
      - "capture that mistake"
      - "LL-"
      - "capture lesson"
      - "lesson"
    capability: Capture a durable lesson learned from an error or repeated failure

  metadata-enforce:
    triggers:
      - "check metadata"
      - "validate frontmatter"
      - "are docs compliant"
      - "metadata check"
      - "frontmatter lint"
    capability: Validate document frontmatter and metadata compliance

  memory-index:
    triggers:
      - "rebuild index"
      - "index docs"
      - "reindex"
      - "build index"
    capability: Build or rebuild the searchable memory index

  memory-summarize:
    triggers:
      - "summarize conversation"
      - "generate thread summary"
      - "summarize thread"
      - "conversation summary"
    capability: Generate durable conversation summaries from stable source material

  governance-review:
    triggers:
      - "check against principles"
      - "governance check"
      - "is this aligned"
      - "principle check"
      - "governance review"
    capability: Review work against module principles and governance rules

  memory-bootstrap:
    triggers:
      - "bootstrap memory"
      - "cold start project"
      - "expedition memory"
      - "bootstrap project"
      - "initialize memory"
      - "cold start"
    capability: Bootstrap durable memory for a new or external project

  memory-prune:
    triggers:
      - "prune memory"
      - "reduce entropy"
      - "clean up knowledge"
      - "stale docs"
      - "merge decisions"
      - "deprecate"
    capability: Prune, merge, or deprecate stale memory non-destructively
